<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;max-width:100%;height:100%;overflow:hidden;background:#1e222a;color:#e3e8f1;font:13px system-ui}button{background:#313b4a;color:white;border:1px solid #4b5565;border-radius:4px;padding:5px;cursor:pointer;white-space:nowrap}.bar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));width:100%;max-width:100%;gap:3px;padding:6px;position:sticky;top:0;background:#262e39;z-index:2}.bar button{flex:1;min-width:0;font-size:11px;padding:5px 2px}#tree{width:100%;max-width:100%;height:calc(100vh - 44px);overflow:auto;position:relative}.node{min-height:29px;display:flex;align-items:center;gap:5px;cursor:pointer;white-space:nowrap;min-width:0;padding-right:6px}.node:hover{background:#374456}.node.selected{background:#245078}.node.over{outline:1px solid #88aaff}.label{overflow:hidden;text-overflow:ellipsis;flex:1}.caret{width:12px;flex:none}.inline{background:#10151c;border:1px solid #87abef;color:#fff;border-radius:3px;min-width:0;flex:1;padding:3px 5px;font:inherit}.inline-actions{display:flex;gap:3px;flex:none}.inline-actions button{padding:2px 4px}#menu{display:none;position:fixed;z-index:10;background:#2a3340;border:1px solid #687488;min-width:220px;max-height:310px;overflow:auto;padding:5px;box-shadow:0 5px 18px #0009}.option{padding:6px;cursor:pointer}.option:hover{background:#42536c}
</style></head><body><div class="bar"><button id="newgroup">＋組別</button><button id="newfolder">＋資料夾</button><button id="newfile">＋文件</button><button id="expand">展開</button></div><div id="tree"></div><div id="menu"></div><script>
let nodes=[],selected=null,opened=new Set(),clip=null,cut=false,seq=0,editing=null;
try{const saved=JSON.parse(sessionStorage.getItem('bv_clip')||'null');if(saved){clip=saved.id;cut=!!saved.cut}}catch(e){}
const get=id=>nodes.find(n=>n.id===id);const folder=n=>n&&['GROUP','SUBFILE'].includes(n.kind);const kids=id=>nodes.filter(n=>n.parent_id===id).sort((a,b)=>(a.position??0)-(b.position??0)||String(a.created_at||'').localeCompare(String(b.created_at||''))||a.id.localeCompare(b.id));
function send(action,data={}){parent.postMessage({isStreamlitMessage:true,type:'streamlit:setComponentValue',value:{action,...data,event_id:Date.now()+'_'+(++seq)}},'*')}
function startEdit(kind,id,target,after=null){editing={kind,id,target,after};if(id){selected=id;opened.add(id)}else if(target){opened.add(target)}render()}
function destination(n){return folder(n)?n?.id:n?.parent_id}
function rememberClipboard(){try{sessionStorage.setItem('bv_clip',JSON.stringify({id:clip,cut}))}catch(e){}}
function act(action,id){const n=get(id);if(!n)return;
 if(action==='rename')return startEdit('rename',id,null);
 if(action==='priority'){const siblings=kids(n.parent_id);const rank=siblings.findIndex(x=>x.id===id)+1;const answer=prompt('設定節點優先權（1～'+siblings.length+'，數字越小越靠前）',String(rank));if(answer===null)return;const value=Number(answer);if(!Number.isInteger(value)||value<1){alert('請輸入正整數');return}return send('priority',{id,priority:value})}

 if(action==='full_edit')return send('full_edit',{id});
 if(action==='full_read')return send('full_read',{id});
 if(action==='workspace_save')return send('workspace_save',{id});
 if(action==='workspace_close')return send('workspace_close',{id});
 if(action==='new_file_dialog')return send('new_file_dialog',{id});
 if(action==='delete_forever'){if(confirm('永久刪除「'+n.title+'」及其子文件？此操作不可復原。')&&confirm('最後確認：永久刪除而非移至回收桶？'))send('delete_forever',{id});return}
 if(action==='quick_nav')return send('quick_nav',{id});
 if(action==='delete'){if(confirm('將「'+n.title+'」移入資源回收區？'))send('delete',{id});return}
 if(action==='copy'||action==='cut'||action==='move'){clip=id;cut=action!=='copy';rememberClipboard();if(action==='move')alert('已選取移動來源；貼上到文件會插入該文件後方，貼上到資料夾則移入資料夾。');return}
 if(action==='paste'){if(!clip){alert('請先複製或剪下文件');return}const src=get(clip);if(!src){clip=null;rememberClipboard();alert('來源文件已不存在，請重新複製');return}const target=destination(n);if(!target&&n.kind!=='GROUP'){alert('請選擇組別或子文件');return}if(cut&&(clip===target||isDescendant(target,clip))){alert('不能將文件移入自己或其子節點');return}send(cut&&!folder(n)?'move_after':'paste',cut&&!folder(n)?{id:clip,target:n.id}:{id:clip,target,cut});if(cut){clip=null;cut=false;rememberClipboard()}return}
 if(action==='import_child'){const target=destination(n);if(target)send('import_child',{target});return}
 if(['SUBFILE','GRAPH','HANDWRITE','COMPOSITE'].includes(action)){const after=folder(n)?null:n.id;return startEdit(action,null,destination(n),after)}
 send(action,{id})
}
function isDescendant(id,ancestor){let visited=new Set();while(id&&!visited.has(id)){if(id===ancestor)return true;visited.add(id);id=get(id)?.parent_id}return false}
let submenu=null;
function showMenu(e,n,group=null){
 e.preventDefault();e.stopPropagation();selected=n.id;render();
 const m=document.getElementById('menu');m.replaceChildren();
 let actions;
 if(group==='new')actions=[['圖文文件','COMPOSITE'],['圖片','GRAPH'],['手寫稿','HANDWRITE']];
 else if(group==='ops')actions=[['節點優先權','priority'],['複製','copy'],['剪下','cut'],['移動','move'],['貼上','paste'],['永久刪除','delete_forever'],['移動回收桶','delete']];
 else actions=[['開啟','select'],['完全單一編輯','full_edit'],['完全單一閱讀','full_read'],['新增文件 ▸','new_file_dialog'],['文件操作 ▸','ops_menu'],['重新命名','rename'],['快速定位','quick_nav'],['儲存增量更新','workspace_save'],['關閉','workspace_close']];
 for(const [label,action] of actions){
  const d=document.createElement('div');d.className='option';d.textContent=label;
  d.onclick=()=>{m.style.display='none';if(action==='ops_menu')return showMenu(e,n,'ops');act(action,n.id)};
  if(action==='new_file_dialog'||action==='ops_menu'){
   d.oncontextmenu=ev=>{ev.preventDefault();ev.stopPropagation();showMenu(ev,n,action==='ops_menu'?'ops':'new')};
  }
  m.append(d);
 }
 m.style.display='block';m.style.left=Math.max(0,Math.min(e.clientX,innerWidth-240))+'px';m.style.top=Math.max(0,Math.min(e.clientY,innerHeight-300))+'px';
}
function context(e,n){showMenu(e,n)}
function editRow(depth,kind,id,target){let row=document.createElement('div');row.className='node';row.style.paddingLeft=(8+depth*16)+'px';let inp=document.createElement('input');inp.className='inline';inp.placeholder=kind==='rename'?'重新命名':'新文件名稱';inp.value=kind==='rename'?(get(id)?.title||''):'';let actions=document.createElement('div');actions.className='inline-actions';let ok=document.createElement('button');ok.textContent='✓';let cancel=document.createElement('button');cancel.textContent='×';let finish=()=>{let title=inp.value.trim();if(title){send(kind==='rename'?'rename':'create',kind==='rename'?{id,title}:{kind,target,title,after:editing.after});editing=null}else{editing=null;render()}};ok.onclick=finish;cancel.onclick=()=>{editing=null;render()};inp.onkeydown=e=>{e.stopPropagation();if(e.key==='Enter')finish();if(e.key==='Escape'){editing=null;render()}};actions.append(ok,cancel);row.append(inp,actions);queueMicrotask(()=>{inp.focus();inp.select()});return row}
function render(){let t=document.getElementById('tree');t.replaceChildren();function draw(n,depth){let r=document.createElement('div');r.className='node'+(n.id===selected?' selected':'');r.style.paddingLeft=(8+depth*16)+'px';r.draggable=true;let caret=document.createElement('span');caret.className='caret';caret.textContent=folder(n)?(opened.has(n.id)?'⌄':'›'):'';caret.onclick=e=>{e.stopPropagation();opened.has(n.id)?opened.delete(n.id):opened.add(n.id);render()};let icon=document.createElement('span');icon.textContent=folder(n)?'📁':({GRAPH:'🖼️',TABLE:'▦',HANDWRITE:'✍️',MARKDOWN:'📄',COMPOSITE:'📝'}[n.kind]||'📄');let label=document.createElement('span');label.className='label';label.textContent=n.title;let priority=document.createElement('span');priority.style.cssText='font-size:10px;color:#9eafc6;min-width:16px;text-align:right';priority.textContent=String(kids(n.parent_id).findIndex(x=>x.id===n.id)+1);r.append(priority);r.append(caret,icon,label);r.onclick=()=>{document.getElementById('menu').style.display='none';selected=n.id;if(folder(n))opened.add(n.id);send('select',{id:n.id});render()};r.ondblclick=()=>{if(folder(n)){opened.has(n.id)?opened.delete(n.id):opened.add(n.id);render()}};r.oncontextmenu=e=>context(e,n);r.ondragstart=e=>e.dataTransfer.setData('text/plain',n.id);r.ondragover=e=>{e.preventDefault();r.classList.add('over')};r.ondragleave=()=>r.classList.remove('over');r.ondrop=e=>{e.preventDefault();r.classList.remove('over');let id=e.dataTransfer.getData('text/plain');if(id&&id!==n.id){if(folder(n)){if(isDescendant(n.id,id))alert('不可移入自己的子節點');else send('move',{id,target:n.id})}else send('move_after',{id,target:n.id})}};if(editing?.kind==='rename'&&editing.id===n.id)t.append(editRow(depth,'rename',n.id,null));else t.append(r);if(editing&&editing.kind!=='rename'&&editing.after===n.id)t.append(editRow(depth,editing.kind,null,editing.target));if(folder(n)&&opened.has(n.id)){if(editing&&editing.kind!=='rename'&&editing.target===n.id&&!editing.after)t.append(editRow(depth+1,editing.kind,null,n.id));kids(n.id).forEach(x=>draw(x,depth+1))}}
if(editing?.kind==='GROUP')t.append(editRow(0,'GROUP',null,null));kids(null).forEach(n=>draw(n,0));}
function create(kind){let target=selected;if(kind!=='GROUP'&&!folder(get(target)))target=get(target)?.parent_id;if(kind!=='GROUP'&&!target){alert('請先選擇一個組別或資料夾');return}startEdit(kind,null,target)}
document.getElementById('newgroup').onclick=()=>create('GROUP');document.getElementById('newfolder').onclick=()=>create('SUBFILE');document.getElementById('newfile').onclick=()=>{if(selected)act('new_file_dialog',selected);else alert('請先選擇一個資料夾')};document.getElementById('expand').onclick=()=>{nodes.filter(folder).forEach(n=>opened.add(n.id));render()};
addEventListener('message',e=>{if(e.data?.type==='streamlit:render'){nodes=e.data.args.nodes||[];selected=e.data.args.selected;dismissMenu();if(!opened.size){nodes.filter(n=>n.kind==='GROUP').forEach(n=>opened.add(n.id));let n=get(selected);while(n){opened.add(n.id);n=get(n.parent_id)}}render()}});function dismissMenu(){const m=document.getElementById('menu');m.style.display='none';submenu=null}
document.addEventListener('pointerdown',e=>{const menu=document.getElementById('menu');if(menu.style.display!=='none'&&!e.target.closest('#menu'))dismissMenu()},true);
window.addEventListener('blur',dismissMenu);
document.addEventListener('visibilitychange',()=>{if(document.hidden)dismissMenu()});
document.addEventListener('click',e=>{if(!e.target.closest('#menu'))dismissMenu()});document.addEventListener('keydown',e=>{if(editing||['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='F2')act('rename',selected);if(e.key==='Delete')act('delete',selected);if((e.ctrlKey||e.metaKey)&&['c','x','v'].includes(e.key.toLowerCase())){if(!get(selected))return;e.preventDefault();act({c:'copy',x:'cut',v:'paste'}[e.key.toLowerCase()],selected)}});parent.postMessage({isStreamlitMessage:true,type:'streamlit:componentReady',apiVersion:1},'*');parent.postMessage({isStreamlitMessage:true,type:'streamlit:setFrameHeight',height:385},'*');
</script></body></html>
