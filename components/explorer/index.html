<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><style>body{margin:0;background:#1e222a;color:#e3e8f1;font:13px system-ui}button{background:#313b4a;color:white;border:1px solid #4b5565;border-radius:4px;padding:5px;cursor:pointer}.bar{display:flex;gap:5px;padding:7px;position:sticky;top:0;background:#262e39}.node{height:29px;display:flex;align-items:center;gap:5px;cursor:pointer;white-space:nowrap}.node:hover{background:#374456}.selected{background:#245078}.over{outline:1px solid #88aaff}#menu{display:none;position:fixed;z-index:10;background:#2a3340;border:1px solid #687488;min-width:155px;padding:5px}.option{padding:7px;cursor:pointer}.option:hover{background:#42536c}</style><div class="bar"><button onclick="create('GROUP',null)">＋組別</button><button onclick="create('SUBFILE',selected)">＋資料夾</button><button onclick="create('MARKDOWN',selected)">＋文件</button><button onclick="expandAll()">展開</button></div><div id="tree"></div><div id="menu"></div><script>
let nodes=[],selected=null,opened=new Set(),clip=null,cut=false,seq=0;const get=id=>nodes.find(n=>n.id===id);const folder=n=>n&&['GROUP','SUBFILE'].includes(n.kind);const kids=id=>nodes.filter(n=>n.parent_id===id).sort((a,b)=>a.position-b.position||a.title.localeCompare(b.title));function send(action,data={}){parent.postMessage({isStreamlitMessage:true,type:'streamlit:setComponentValue',value:{action,...data,event_id:Date.now()+'_'+(++seq)}},'*')}function create(kind,target){if(kind!=='GROUP'&&!folder(get(target)))target=get(target)?.parent_id;let title=prompt('新文件名稱');if(title?.trim())send('create',{kind,target,title:title.trim()})}function act(action,id){const n=get(id);if(!n)return;if(action==='rename'){let title=prompt('重新命名',n.title);if(title?.trim())send(action,{id,title:title.trim()})}else if(action==='delete'){if(confirm('將文件移入資源回收區？'))send(action,{id})}else if(action==='copy'||action==='cut'){clip=id;cut=action==='cut'}else if(action==='paste'){if(clip&&folder(n))send(action,{id:clip,target:id,cut})}else if(['SUBFILE','MARKDOWN','GRAPH','TABLE'].includes(action))create(action,id);else send(action,{id})}function context(e,n){e.preventDefault();selected=n.id;render();let m=document.getElementById('menu');m.replaceChildren();for(let [label,action] of [['開啟','select'],['重新命名','rename'],['新增子文件','SUBFILE'],['新增一般文件','MARKDOWN'],['新增圖文件','GRAPH'],['新增表格','TABLE'],['複製','copy'],['剪下','cut'],['貼上','paste'],['刪除','delete']]){if(!folder(n)&&['SUBFILE','MARKDOWN','GRAPH','TABLE'].includes(action))continue;let d=document.createElement('div');d.className='option';d.textContent=label;d.onclick=()=>{m.style.display='none';act(action,n.id)};m.append(d)}m.style.display='block';m.style.left=Math.min(e.clientX,innerWidth-160)+'px';m.style.top=Math.min(e.clientY,innerHeight-300)+'px'}function render(){let t=document.getElementById('tree');t.replaceChildren();function draw(n,depth){let r=document.createElement('div');r.className='node'+(n.id===selected?' selected':'');r.style.paddingLeft=(8+depth*16)+'px';r.draggable=true;let icon=folder(n)?(opened.has(n.id)?'⌄ 📁':'› 📁'):({GRAPH:'🖼️',TABLE:'▦',MARKDOWN:'📄'}[n.kind]||'📄');r.textContent=icon+' '+n.title;r.onclick=()=>{selected=n.id;if(folder(n))opened.add(n.id);send('select',{id:n.id});render()};r.ondblclick=()=>{if(folder(n)){opened.has(n.id)?opened.delete(n.id):opened.add(n.id);render()}};r.oncontextmenu=e=>context(e,n);r.ondragstart=e=>e.dataTransfer.setData('text/plain',n.id);r.ondragover=e=>{e.preventDefault();r.classList.add('over')};r.ondragleave=()=>r.classList.remove('over');r.ondrop=e=>{e.preventDefault();r.classList.remove('over');let id=e.dataTransfer.getData('text/plain');if(id&&id!==n.id)send(folder(n)?'move':'reorder',{id,target:n.id})};t.append(r);if(folder(n)&&opened.has(n.id))kids(n.id).forEach(x=>draw(x,depth+1))}kids(null).forEach(n=>draw(n,0));parent.postMessage({isStreamlitMessage:true,type:'streamlit:setFrameHeight',height:Math.max(510,document.body.scrollHeight+10)},'*')}function expandAll(){nodes.filter(folder).forEach(n=>opened.add(n.id));render()}addEventListener('message',e=>{if(e.data?.type==='streamlit:render'){nodes=e.data.args.nodes||[];selected=e.data.args.selected;if(!opened.size){nodes.filter(n=>n.kind==='GROUP').forEach(n=>opened.add(n.id));let n=get(selected);while(n){opened.add(n.id);n=get(n.parent_id)}}render()}});document.addEventListener('click',e=>{if(!e.target.closest('#menu'))document.getElementById('menu').style.display='none'});document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='F2')act('rename',selected);if(e.key==='Delete')act('delete',selected);if((e.ctrlKey||e.metaKey)&&['c','x','v'].includes(e.key.toLowerCase())){e.preventDefault();act({c:'copy',x:'cut',v:'paste'}[e.key.toLowerCase()],selected)}});parent.postMessage({isStreamlitMessage:true,type:'streamlit:componentReady',apiVersion:1},'*');
</script></html>
