<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#1e222a;color:#e3e8f1;font:13px system-ui}button{background:#313b4a;color:white;border:1px solid #4b5565;border-radius:4px;padding:5px;cursor:pointer;white-space:nowrap}.bar{display:flex;gap:3px;padding:6px;position:sticky;top:0;background:#262e39;z-index:2}.bar button{flex:1;min-width:0;font-size:11px;padding:5px 2px}#tree{height:calc(100vh - 44px);overflow:auto;position:relative}.node{min-height:29px;display:flex;align-items:center;gap:5px;cursor:pointer;white-space:nowrap;min-width:0;padding-right:6px}.node:hover{background:#374456}.node.selected{background:#245078}.node.over{outline:1px solid #88aaff}.label{overflow:hidden;text-overflow:ellipsis;flex:1}.caret{width:12px;flex:none}.inline{background:#10151c;border:1px solid #87abef;color:#fff;border-radius:3px;min-width:0;flex:1;padding:3px 5px;font:inherit}.inline-actions{display:flex;gap:3px;flex:none}.inline-actions button{padding:2px 4px}#menu{display:none;position:fixed;z-index:10;background:#2a3340;border:1px solid #687488;min-width:150px;max-height:260px;overflow:auto;padding:5px;box-shadow:0 5px 18px #0009}.option{padding:6px;cursor:pointer}.option:hover{background:#42536c}
</style></head><body><div class="bar"><button id="newgroup">＋組別</button><button id="newfolder">＋資料夾</button><button id="newfile">＋文件</button><button id="expand">展開</button></div><div id="tree"></div><div id="menu"></div><script>
let nodes=[],selected=null,opened=new Set(),clip=null,cut=false,seq=0,editing=null;
const get=id=>nodes.find(n=>n.id===id);const folder=n=>n&&['GROUP','SUBFILE'].includes(n.kind);const kids=id=>nodes.filter(n=>n.parent_id===id).sort((a,b)=>a.position-b.position||a.title.localeCompare(b.title));
function send(action,data={}){parent.postMessage({isStreamlitMessage:true,type:'streamlit:setComponentValue',value:{action,...data,event_id:Date.now()+'_'+(++seq)}},'*')}
function startEdit(kind,id,target){editing={kind,id,target};if(id){selected=id;opened.add(id)}else if(target){opened.add(target)}render()}
function act(action,id){const n=get(id);if(!n)return;if(action==='rename')startEdit('rename',id,null);else if(action==='delete'){if(confirm('將「'+n.title+'」移入資源回收區？'))send('delete',{id})}else if(action==='copy'||action==='cut'){clip=id;cut=action==='cut'}else if(action==='paste'){if(clip&&folder(n))send('paste',{id:clip,target:id,cut})}else if(['SUBFILE','MARKDOWN','GRAPH','TABLE'].includes(action))startEdit(action,null,id);else send(action,{id})}
function context(e,n){e.preventDefault();selected=n.id;render();let m=document.getElementById('menu');m.replaceChildren();for(let [label,action] of [['開啟','select'],['重新命名','rename'],['新增子文件','SUBFILE'],['新增一般文件','MARKDOWN'],['新增圖文件','GRAPH'],['新增表格','TABLE'],['複製','copy'],['剪下','cut'],['貼上','paste'],['移至資源回收區','delete']]){if(!folder(n)&&['SUBFILE','MARKDOWN','GRAPH','TABLE'].includes(action))continue;let d=document.createElement('div');d.className='option';d.textContent=label;d.onclick=()=>{m.style.display='none';act(action,n.id)};m.append(d)}m.style.display='block';m.style.left=Math.max(0,Math.min(e.clientX,innerWidth-155))+'px';m.style.top=Math.max(0,Math.min(e.clientY,innerHeight-265))+'px'}
function editRow(depth,kind,id,target){let row=document.createElement('div');row.className='node';row.style.paddingLeft=(8+depth*16)+'px';let inp=document.createElement('input');inp.className='inline';inp.placeholder=kind==='rename'?'重新命名':'新文件名稱';inp.value=kind==='rename'?(get(id)?.title||''):'';let actions=document.createElement('div');actions.className='inline-actions';let ok=document.createElement('button');ok.textContent='✓';let cancel=document.createElement('button');cancel.textContent='×';let finish=()=>{let title=inp.value.trim();if(title){send(kind==='rename'?'rename':'create',kind==='rename'?{id,title}:{kind,target,title});editing=null}else{editing=null;render()}};ok.onclick=finish;cancel.onclick=()=>{editing=null;render()};inp.onkeydown=e=>{e.stopPropagation();if(e.key==='Enter')finish();if(e.key==='Escape'){editing=null;render()}};actions.append(ok,cancel);row.append(inp,actions);queueMicrotask(()=>{inp.focus();inp.select()});return row}
function render(){let t=document.getElementById('tree');t.replaceChildren();function draw(n,depth){let r=document.createElement('div');r.className='node'+(n.id===selected?' selected':'');r.style.paddingLeft=(8+depth*16)+'px';r.draggable=true;let caret=document.createElement('span');caret.className='caret';caret.textContent=folder(n)?(opened.has(n.id)?'⌄':'›'):'';caret.onclick=e=>{e.stopPropagation();opened.has(n.id)?opened.delete(n.id):opened.add(n.id);render()};let icon=document.createElement('span');icon.textContent=folder(n)?'📁':({GRAPH:'🖼️',TABLE:'▦',MARKDOWN:'📄'}[n.kind]||'📄');let label=document.createElement('span');label.className='label';label.textContent=n.title;r.append(caret,icon,label);r.onclick=()=>{selected=n.id;if(folder(n))opened.add(n.id);send('select',{id:n.id});render()};r.ondblclick=()=>{if(folder(n)){opened.has(n.id)?opened.delete(n.id):opened.add(n.id);render()}};r.oncontextmenu=e=>context(e,n);r.ondragstart=e=>e.dataTransfer.setData('text/plain',n.id);r.ondragover=e=>{e.preventDefault();r.classList.add('over')};r.ondragleave=()=>r.classList.remove('over');r.ondrop=e=>{e.preventDefault();r.classList.remove('over');let id=e.dataTransfer.getData('text/plain');if(id&&id!==n.id)send(folder(n)?'move':'reorder',{id,target:n.id})};if(editing?.kind==='rename'&&editing.id===n.id)t.append(editRow(depth,'rename',n.id,null));else t.append(r);if(folder(n)&&opened.has(n.id)){if(editing&&editing.kind!=='rename'&&editing.target===n.id)t.append(editRow(depth+1,editing.kind,null,n.id));kids(n.id).forEach(x=>draw(x,depth+1))}}
if(editing?.kind==='GROUP')t.append(editRow(0,'GROUP',null,null));kids(null).forEach(n=>draw(n,0));}
function create(kind){let target=selected;if(kind!=='GROUP'&&!folder(get(target)))target=get(target)?.parent_id;if(kind!=='GROUP'&&!target){alert('請先選擇一個組別或資料夾');return}startEdit(kind,null,target)}
document.getElementById('newgroup').onclick=()=>create('GROUP');document.getElementById('newfolder').onclick=()=>create('SUBFILE');document.getElementById('newfile').onclick=()=>create('MARKDOWN');document.getElementById('expand').onclick=()=>{nodes.filter(folder).forEach(n=>opened.add(n.id));render()};
addEventListener('message',e=>{if(e.data?.type==='streamlit:render'){nodes=e.data.args.nodes||[];selected=e.data.args.selected;if(!opened.size){nodes.filter(n=>n.kind==='GROUP').forEach(n=>opened.add(n.id));let n=get(selected);while(n){opened.add(n.id);n=get(n.parent_id)}}render()}});document.addEventListener('click',e=>{if(!e.target.closest('#menu'))document.getElementById('menu').style.display='none'});document.addEventListener('keydown',e=>{if(editing||['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='F2')act('rename',selected);if(e.key==='Delete')act('delete',selected);if((e.ctrlKey||e.metaKey)&&['c','x','v'].includes(e.key.toLowerCase())){e.preventDefault();act({c:'copy',x:'cut',v:'paste'}[e.key.toLowerCase()],selected)}});parent.postMessage({isStreamlitMessage:true,type:'streamlit:componentReady',apiVersion:1},'*');parent.postMessage({isStreamlitMessage:true,type:'streamlit:setFrameHeight',height:385},'*');
</script></body></html>
