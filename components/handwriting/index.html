<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>body{margin:0;font:14px system-ui;color:#ddd}#bar{display:flex;gap:8px;flex-wrap:wrap;padding:6px}button,input,select{font:inherit}button{border:1px solid #777;background:#333;color:#fff;padding:7px;border-radius:6px}canvas{display:block;background:white;border:1px solid #777;touch-action:none;width:100%;height:420px;box-sizing:border-box}</style></head><body><div id="bar"><label>筆色 <input id="color" type="color" value="#111111"></label><label>粗細 <input id="width" type="range" min="1" max="28" value="3"></label><button id="pen">畫筆</button><button id="eraser">橡皮擦</button><button id="undo">復原</button><button id="clear">清空</button><button id="save">儲存手寫稿</button></div><canvas id="canvas" width="1200" height="680"></canvas><script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),color=document.getElementById('color'),width=document.getElementById('width');let erasing=false,drawing=false,last=null,history=[];ctx.fillStyle='white';ctx.fillRect(0,0,canvas.width,canvas.height);
function snapshot(){if(history.length>=20)history.shift();history.push(canvas.toDataURL('image/png'))}function coords(e){const r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}canvas.addEventListener('pointerdown',e=>{snapshot();drawing=true;last=coords(e);canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drawing)return;const p=coords(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.strokeStyle=erasing?'white':color.value;ctx.lineWidth=Number(width.value)*(erasing?6:1);ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();last=p});function end(){drawing=false;last=null}canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);document.getElementById('pen').onclick=()=>erasing=false;document.getElementById('eraser').onclick=()=>erasing=true;document.getElementById('undo').onclick=()=>{const data=history.pop();if(!data)return;const img=new Image();img.onload=()=>{ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0)};img.src=data};document.getElementById('clear').onclick=()=>{snapshot();ctx.fillStyle='white';ctx.fillRect(0,0,canvas.width,canvas.height)};document.getElementById('save').onclick=()=>parent.postMessage({isStreamlitMessage:true,type:'streamlit:setComponentValue',value:{action:'save',nonce:crypto.randomUUID(),data:canvas.toDataURL('image/png')}},'*');window.addEventListener('message',e=>{if(e.data?.type==='streamlit:render'){const a=e.data.args||{},w=Number(a.width_px)||1200,h=Number(a.height_px)||680;if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;ctx.fillStyle='white';ctx.fillRect(0,0,w,h)}parent.postMessage({isStreamlitMessage:true,type:'streamlit:setFrameHeight',height:510},'*')}});parent.postMessage({isStreamlitMessage:true,type:'streamlit:componentReady',apiVersion:1},'*');parent.postMessage({isStreamlitMessage:true,type:'streamlit:setFrameHeight',height:510},'*');
</script></body></html>
