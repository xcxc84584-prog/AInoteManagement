<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><style>body{margin:0;font:14px system-ui;color:#d9e2f2;background:transparent}#target{border:1px dashed #8697b8;background:#242b3a;border-radius:9px;padding:14px;min-height:48px;outline:none}#target:focus{border-color:#8db6ff}small{opacity:.8}button{background:#3d5377;color:white;border:0;padding:7px 12px;border-radius:6px;margin-top:8px;cursor:pointer}</style></head><body><div id="target" contenteditable="true" role="textbox" aria-label="貼上 ChatGPT 富文本">點擊此處，按 Ctrl+V 貼上 ChatGPT 內容</div><small id="status">支援 HTML、Markdown、表格與剪貼簿圖片；外部圖片可能無法直接取得。</small><script>
const target=document.getElementById('target'),status=document.getElementById('status');
function send(type,data){parent.postMessage({isStreamlitMessage:true,type,...data},'*')}
function resize(){send('streamlit:setFrameHeight',{height:document.body.scrollHeight+10})}
function clean(s){return (s||'').replace(/\u00a0/g,' ').replace(/\r/g,'')}
function inline(node){if(node.nodeType===3)return clean(node.nodeValue);if(node.nodeType!==1)return '';let tag=node.tagName.toLowerCase(),v=Array.from(node.childNodes).map(inline).join('');if(tag==='br')return '\n';if(tag==='strong'||tag==='b')return '**'+v+'**';if(tag==='em'||tag==='i')return '*'+v+'*';if(tag==='code')return '`'+v.replace(/`/g,'\\`')+'`';if(tag==='a'){let href=node.getAttribute('href')||'';return /^https?:\/\//i.test(href)?'['+v+']('+href+')':v}if(tag==='img'){let src=node.getAttribute('src')||'';return '!['+(node.getAttribute('alt')||'圖片').replace(/[\[\]]/g,'')+']('+src+')'}if(tag==='del'||tag==='s')return '~~'+v+'~~';return v}
function table(node){let rows=Array.from(node.querySelectorAll('tr')).map(tr=>Array.from(tr.children).filter(c=>/^(TH|TD)$/.test(c.tagName)).map(c=>inline(c).replace(/\|/g,'\\|').replace(/\n/g,' ')));let n=Math.max(0,...rows.map(r=>r.length));if(!n)return '';let fill=r=>Array.from({length:n},(_,i)=>r[i]||'');let lines=[fill(rows[0]),Array(n).fill('---'),...rows.slice(1).map(fill)];return '\n'+lines.map(r=>'| '+r.join(' | ')+' |').join('\n')+'\n\n'}
function block(node){if(node.nodeType===3)return clean(node.nodeValue);if(node.nodeType!==1)return '';let tag=node.tagName.toLowerCase();if(tag==='table')return table(node);if(tag==='pre')return '\n```\n'+clean(node.textContent).replace(/\n+$/,'')+'\n```\n\n';if(/^h[1-6]$/.test(tag))return '\n'+'#'.repeat(+tag[1])+' '+inline(node).trim()+'\n\n';if(tag==='ul'||tag==='ol'){let items=Array.from(node.children).filter(n=>n.tagName==='LI');return '\n'+items.map((li,i)=>(tag==='ol'?(i+1)+'. ':'- ')+Array.from(li.childNodes).map(n=>n.nodeType===1&&/^(UL|OL)$/.test(n.tagName)?'\n'+block(n):inline(n)).join('').trim()).join('\n')+'\n\n'}if(tag==='blockquote')return '\n'+inline(node).trim().split('\n').map(x=>'> '+x).join('\n')+'\n\n';if(tag==='p'||tag==='div'||tag==='section'||tag==='article')return '\n'+Array.from(node.childNodes).map(n=>n.nodeType===1&&/^(TABLE|PRE|UL|OL|DIV|P|SECTION|ARTICLE|H[1-6]|BLOCKQUOTE)$/.test(n.tagName)?block(n):inline(n)).join('')+'\n\n';if(tag==='hr')return '\n---\n';return Array.from(node.childNodes).map(block).join('')}
function markdown(html){let doc=new DOMParser().parseFromString(html,'text/html');doc.querySelectorAll('script,style,iframe,object,svg,form').forEach(n=>n.remove());return block(doc.body).replace(/\n{3,}/g,'\n\n').trim()}
function dataUrl(file){return new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}
async function paste(e){e.preventDefault();let cb=e.clipboardData,html=cb.getData('text/html'),plain=cb.getData('text/plain');let imgs=[];let files=Array.from(cb.items||[]).filter(x=>x.kind==='file'&&x.type.startsWith('image/'));for(let it of files){let f=it.getAsFile();if(f&&f.size<=10*1024*1024)imgs.push({data:await dataUrl(f),name:f.name||'clipboard.png'})}let md=html?markdown(html):plain;if(!md&&imgs.length)md=imgs.map((_,i)=>'![貼上圖片](clipboard-image://'+i+')').join('\n\n');if(imgs.length&&html){let k=0;md=md.replace(/!\[[^\]]*\]\([^)]*\)/g,m=>k<imgs.length?'![貼上圖片](clipboard-image://'+(k++)+')':m)}let payload={markdown:md,images:imgs,nonce:crypto.randomUUID()};send('streamlit:setComponentValue',{value:payload});target.textContent='已接收 '+md.length+' 個文字字元，請使用下方「套用貼上內容」';status.textContent='貼上完成。若含網路圖片，請確認預覽是否正常。';resize()}
target.addEventListener('paste',e=>{paste(e).catch(err=>{status.textContent='貼上失敗：'+err.message;resize()})});target.addEventListener('focus',()=>{if(target.textContent.startsWith('點擊此處'))target.textContent=''});window.addEventListener('message',e=>{if(e.data?.type==='streamlit:render')resize()});send('streamlit:componentReady',{apiVersion:1});resize();
</script></body></html>
