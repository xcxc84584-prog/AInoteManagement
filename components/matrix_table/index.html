<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><style>body{margin:0;font:13px system-ui;color:#ddd}#scroll{overflow:auto;max-height:500px;border:1px solid #777}table{border-collapse:collapse;table-layout:fixed}td,th{border:1px solid #858585;box-sizing:border-box;padding:0}td.selected{outline:2px solid #1976d2;outline-offset:-2px;background:#d5ebff}input.cell{display:block;width:100%;height:100%;border:0;outline:0;background:white;color:black;box-sizing:border-box;padding:4px;font:13px system-ui}th{background:#e5e5e5;color:#111}#menu{display:none;position:fixed;background:#222;border:1px solid #888;padding:10px;border-radius:7px;z-index:20;width:min(360px,85vw);box-shadow:0 5px 20px #0007}#formula{width:95%;box-sizing:border-box}button,select{margin:3px;padding:5px}#msg{font-size:12px;padding:5px;color:#a5cfff}</style></head><body><div><label>文字對齊 <select id="align"><option value="left">靠左</option><option value="center">置中</option><option value="right">靠右</option></select></label><button id="save">套用表格修改</button><span id="msg">拖曳選取範圍，右鍵輸入函數</span></div><div id="scroll"><table id="grid"></table></div><div id="menu"><div>f(row,column)=</div><input id="formula" placeholder="row*2+1 或 A[0,0][1,1]*A[0,2][1,2]"><div><button id="apply">套用函數</button><button id="cancel">取消</button></div></div><script>
let args={},cells=[],heads=[],start=null,end=null,drag=false;const grid=document.getElementById('grid'),menu=document.getElementById('menu'),msg=document.getElementById('msg'),align=document.getElementById('align');function send(o){parent.postMessage({isStreamlitMessage:true,type:'streamlit:setComponentValue',value:{...o,nonce:crypto.randomUUID()}},'*')}function size(){parent.postMessage({isStreamlitMessage:true,type:'streamlit:setFrameHeight',height:Math.min(600,document.body.scrollHeight+15)},'*')}function rect(){if(!start)return null;let a=end||start;return [Math.min(start[0],a[0]),Math.min(start[1],a[1]),Math.max(start[0],a[0]),Math.max(start[1],a[1])]}function mark(){const v=rect();document.querySelectorAll('td').forEach(td=>{const r=+td.dataset.r,c=+td.dataset.c;td.classList.toggle('selected',!!v&&r>=v[0]&&r<=v[2]&&c>=v[1]&&c<=v[3])})}function render(){grid.replaceChildren();cells.forEach((row,r)=>{const tr=document.createElement('tr');row.forEach((value,c)=>{const td=document.createElement('td');td.dataset.r=r;td.dataset.c=c;td.title='('+r+'*'+c+')';td.style.width=(args.width||120)+'px';td.style.minWidth=(args.width||120)+'px';td.style.height=(args.height||40)+'px';const input=document.createElement('input');input.className='cell';input.value=value??'';input.style.textAlign=align.value;input.oninput=()=>cells[r][c]=input.value;td.onpointerdown=e=>{if(e.button!==0)return;start=[r,c];end=start;drag=true;mark()};td.onpointerenter=()=>{if(drag){end=[r,c];mark()}};td.oncontextmenu=e=>{e.preventDefault();if(!start){start=[r,c];end=start;mark()}menu.style.display='block';menu.style.left=Math.max(0,Math.min(e.clientX,innerWidth-370))+'px';menu.style.top=Math.max(0,Math.min(e.clientY,innerHeight-130))+'px';document.getElementById('formula').focus()};td.append(input);tr.append(td)});grid.append(tr)});size()}document.addEventListener('pointerup',()=>drag=false);document.getElementById('cancel').onclick=()=>menu.style.display='none';document.getElementById('apply').onclick=()=>{const selected=rect();if(!selected){msg.textContent='請先選取範圍';return}const formula=document.getElementById('formula').value;menu.style.display='none';send({action:'formula',cells,headers:heads,selection:selected,formula,align:align.value});msg.textContent='正在計算選取範圍…'};document.getElementById('save').onclick=()=>{send({action:'save',cells,headers:heads,align:align.value});msg.textContent='正在同步表格…'};align.onchange=()=>document.querySelectorAll('.cell').forEach(x=>x.style.textAlign=align.value);window.addEventListener('message',e=>{if(e.data?.type!=='streamlit:render')return;const next=e.data.args||{};if(next.error&&next.errorId!==args.errorId){window.alert('表格計算失敗：'+next.error)}if(next.revision!==args.revision||!cells.length){cells=next.cells||[];heads=next.headers||[];align.value=next.align||'left'}args=next;render()});parent.postMessage({isStreamlitMessage:true,type:'streamlit:componentReady',apiVersion:1});size();
</script></body></html>
