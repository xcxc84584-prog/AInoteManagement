<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><style>
body{margin:0;font:13px system-ui;color:#ddd}#scroll{overflow:auto;max-height:520px;border:1px solid #777;touch-action:pan-x pan-y}table{border-collapse:collapse;table-layout:fixed}td{border:1px solid #858585;box-sizing:border-box;padding:0}td.selected{outline:2px solid #1976d2;outline-offset:-2px;background:#d5ebff}input.cell{display:block;width:100%;height:100%;border:0;outline:0;background:white;color:black;box-sizing:border-box;padding:4px;font:13px system-ui}#menu{display:none;position:fixed;background:#222;border:1px solid #888;padding:10px;border-radius:7px;z-index:20;width:min(360px,85vw);box-shadow:0 5px 20px #0007}#formula{width:95%;box-sizing:border-box}button,select,input[type=number]{margin:3px;padding:5px}#msg{font-size:12px;padding:5px;color:#a5cfff}#format{display:none;position:fixed;z-index:21;background:#222;border:1px solid #888;padding:10px;border-radius:7px;box-shadow:0 5px 20px #0007}
</style></head><body><div><label>文字對齊 <select id="align"><option value="left">靠左</option><option value="center">置中</option><option value="right">靠右</option></select></label><button id="formatOpen">選取範圍數值格式</button><button id="save">套用表格修改</button><span id="msg">拖曳選取範圍，右鍵輸入函數</span></div><div id="scroll"><table id="grid"></table></div><div id="menu"><div>f(row,column)=(運算式)&lt;浮點數精度&gt;</div><input id="formula" placeholder="f(row,column)=(row/(column+1)+f(row-1,column-1).stop(row<0 && column<0))<3>"><div><button id="apply">套用函數</button><button id="cancel">取消</button></div></div><div id="format"><label>顯示方式 <select id="mode"><option value="decimal">小數點後固定位數</option><option value="significant">有效數字</option></select></label><label>位數 <input id="digits" type="number" min="0" max="15" value="2" style="width:55px"></label><div><button id="formatApply">套用到選取範圍</button><button id="formatCancel">取消</button></div></div><script>
let args={},cells=[],heads=[],start=null,end=null,drag=false,lastPointer=null,raf=0;const grid=document.getElementById('grid'),scroll=document.getElementById('scroll'),menu=document.getElementById('menu'),format=document.getElementById('format'),msg=document.getElementById('msg'),align=document.getElementById('align');
function send(o){parent.postMessage({isStreamlitMessage:true,type:'streamlit:setComponentValue',value:{...o,nonce:crypto.randomUUID()}},'*')}
function size(){parent.postMessage({isStreamlitMessage:true,type:'streamlit:setFrameHeight',height:Math.min(650,document.body.scrollHeight+15)},'*')}
function rect(){if(!start)return null;let a=end||start;return [Math.min(start[0],a[0]),Math.min(start[1],a[1]),Math.max(start[0],a[0]),Math.max(start[1],a[1])]}
function mark(){const v=rect();grid.querySelectorAll('td').forEach(td=>{const r=+td.dataset.r,c=+td.dataset.c;td.classList.toggle('selected',!!v&&r>=v[0]&&r<=v[2]&&c>=v[1]&&c<=v[3])})}
function locate(x,y){const td=document.elementFromPoint(x,y)?.closest('td');if(td&&grid.contains(td)){end=[+td.dataset.r,+td.dataset.c];mark()}}
function tick(){raf=0;if(!drag||!lastPointer)return;const {x,y}=lastPointer;const b=scroll.getBoundingClientRect();let dx=0,dy=0;if(x>=b.left&&x<=b.right){if(x>b.right-24)dx=18;else if(x<b.left+24)dx=-18}if(y>=b.top&&y<=b.bottom){if(y>b.bottom-24)dy=18;else if(y<b.top+24)dy=-18}if(dx||dy){scroll.scrollBy(dx,dy);locate(Math.min(b.right-4,Math.max(b.left+4,x)),Math.min(b.bottom-4,Math.max(b.top+4,y)));raf=requestAnimationFrame(tick)}}
function render(){grid.replaceChildren();cells.forEach((row,r)=>{const tr=document.createElement('tr');row.forEach((value,c)=>{const td=document.createElement('td');td.dataset.r=r;td.dataset.c=c;td.title='('+r+'*'+c+')';td.style.width=(args.width||120)+'px';td.style.minWidth=(args.width||120)+'px';td.style.height=(args.height||40)+'px';const input=document.createElement('input');input.className='cell';input.value=value??'';input.title=td.title;input.style.textAlign=align.value;input.oninput=()=>cells[r][c]=input.value;td.onpointerdown=e=>{if(e.button!==0)return;start=[r,c];end=start;drag=true;lastPointer={x:e.clientX,y:e.clientY};mark();e.preventDefault()};td.oncontextmenu=e=>{e.preventDefault();if(!start){start=[r,c];end=start;mark()}menu.style.display='block';menu.style.left=Math.max(0,Math.min(e.clientX,innerWidth-370))+'px';menu.style.top=Math.max(0,Math.min(e.clientY,innerHeight-130))+'px';document.getElementById('formula').focus()};td.append(input);tr.append(td)});grid.append(tr)});mark();size()}
document.addEventListener('pointermove',e=>{if(!drag)return;lastPointer={x:e.clientX,y:e.clientY};locate(e.clientX,e.clientY);if(!raf)raf=requestAnimationFrame(tick)});document.addEventListener('pointerup',()=>{drag=false;cancelAnimationFrame(raf);raf=0});window.addEventListener('blur',()=>{drag=false;cancelAnimationFrame(raf);raf=0});
document.getElementById('cancel').onclick=()=>menu.style.display='none';document.getElementById('apply').onclick=()=>{const selection=rect();if(!selection){alert('請先選取範圍');return}const formula=document.getElementById('formula').value;menu.style.display='none';send({action:'formula',cells,headers:heads,selection,formula,align:align.value});msg.textContent='正在計算選取範圍…'};
document.getElementById('formatOpen').onclick=()=>{if(!rect()){alert('請先框選儲存格');return}format.style.display='block';format.style.left='10px';format.style.top='48px';size()};document.getElementById('formatCancel').onclick=()=>{format.style.display='none';size()};document.getElementById('formatApply').onclick=()=>{const mode=document.getElementById('mode').value,digits=Number(document.getElementById('digits').value);if(!Number.isInteger(digits)||digits<0||digits>15||(mode==='significant'&&digits===0)){alert('位數必須在 0–15，有效數字至少 1 位');return}format.style.display='none';send({action:'format',cells,headers:heads,selection:rect(),formatMode:mode,digits,align:align.value});msg.textContent='正在更新選取範圍的數值格式…'};
document.getElementById('save').onclick=()=>{send({action:'save',cells,headers:heads,align:align.value});msg.textContent='正在同步表格…'};align.onchange=()=>document.querySelectorAll('.cell').forEach(x=>x.style.textAlign=align.value);window.addEventListener('message',e=>{if(e.data?.type!=='streamlit:render')return;const next=e.data.args||{};if(next.error&&next.errorId!==args.errorId)window.alert('表格計算失敗：'+next.error);if(next.revision!==args.revision||!cells.length){cells=next.cells||[];heads=next.headers||[];align.value=next.align||'left'}args=next;render()});parent.postMessage({isStreamlitMessage:true,type:'streamlit:componentReady',apiVersion:1});size();
</script></body></html>
