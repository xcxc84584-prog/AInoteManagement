<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;font:14px system-ui;color:#d4d9e5}#drop{border:1px dashed #788bb0;border-radius:9px;padding:14px;text-align:center;background:#242936;cursor:pointer}#drop:focus{outline:2px solid #7896e8}small{opacity:.7}</style></head><body><div id="drop" tabindex="0">點擊此區域後按 Ctrl+V 貼上圖片，或拖曳圖片<br><small>PNG / JPEG / WebP / GIF，最大 10 MB</small></div><script>
const drop=document.getElementById('drop');
function send(type,data){window.parent.postMessage({isStreamlitMessage:true,type,...data},'*')}
function resize(){send('streamlit:setFrameHeight',{height:document.body.scrollHeight+8})}
async function receive(file){
 if(!file||!file.type.startsWith('image/'))return;
 if(file.size>10*1024*1024){drop.textContent='圖片超過 10 MB，請先縮小圖片';resize();return}
 drop.textContent='正在讀取貼上的圖片…';resize();
 try{
  const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(reader.error);reader.readAsDataURL(file)});
  send('streamlit:setComponentValue',{value:{name:file.name||'pasted.png',mime:file.type,data,nonce:crypto.randomUUID()}});
  drop.textContent='已接收圖片，請點選下方「儲存圖片」';resize();
 }catch(e){drop.textContent='圖片讀取失敗，請重試';resize()}
}
drop.addEventListener('click',()=>drop.focus());
drop.addEventListener('paste',e=>{const f=Array.from(e.clipboardData?.files||[]).find(f=>f.type.startsWith('image/'));if(f){e.preventDefault();receive(f)}});
drop.addEventListener('dragover',e=>e.preventDefault());
drop.addEventListener('drop',e=>{e.preventDefault();receive(e.dataTransfer.files[0])});
window.addEventListener('message',e=>{if(e.data?.type==='streamlit:render')resize()});
send('streamlit:componentReady',{apiVersion:1});resize();
</script></body></html>
