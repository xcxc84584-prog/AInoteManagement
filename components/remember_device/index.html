<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"></head><body style="margin:0"><script>
const KEY='ainote_remember_refresh_v1';
let lastCommand='';
function send(type, data){parent.postMessage({isStreamlitMessage:true,type,...data},'*')}
window.addEventListener('message', e=>{
  if(e.data?.type!=='streamlit:render')return;
  const args=e.data.args||{};
  const command=args.command||'';
  const requestId=args.request_id||'';
  if(command==='store'&&requestId!==lastCommand){
    lastCommand=requestId;
    try{localStorage.setItem(KEY,args.refresh_token||'')}catch(err){}
  }else if(command==='clear'&&requestId!==lastCommand){
    lastCommand=requestId;
    try{localStorage.removeItem(KEY)}catch(err){}
  }
  let token=null;
  try{token=localStorage.getItem(KEY)}catch(err){}
  send('streamlit:setComponentValue',{value:{refresh_token:token,request_id:requestId}});
  send('streamlit:setFrameHeight',{height:0});
});
send('streamlit:componentReady',{apiVersion:1});
</script></body></html>
