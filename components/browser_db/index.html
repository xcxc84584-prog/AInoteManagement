<!doctype html><html><head><meta charset="utf-8"></head><body><script>
const send=(type,data)=>window.parent.postMessage({isStreamlitMessage:true,type,...data},'*');
let last='';
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open('bvtext-localfirst-v1',1);r.onupgradeneeded=()=>r.result.createObjectStore('workspaces');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}
async function action(args){const db=await openDB();const key=args.user_id;const mode=args.mode;
const tx=db.transaction('workspaces',mode==='save'?'readwrite':'readonly');const store=tx.objectStore('workspaces');
const req=mode==='save'?store.put(args.snapshot,key):store.get(key);
return new Promise((resolve,reject)=>{req.onsuccess=()=>resolve(mode==='save'?{ok:true,revision:args.revision}:{ok:true,snapshot:req.result||null});req.onerror=()=>reject(req.error);});}
window.addEventListener('message',async e=>{if(e.data.type!=='streamlit:render')return;const a=e.data.args||{};const id=JSON.stringify([a.user_id,a.mode,a.revision]);if(id===last)return;last=id;try{send('streamlit:setComponentValue',{value:await action(a)});}catch(err){send('streamlit:setComponentValue',{value:{ok:false,error:String(err)}});}});
send('streamlit:componentReady',{apiVersion:1});send('streamlit:setFrameHeight',{height:0});
</script></body></html>
