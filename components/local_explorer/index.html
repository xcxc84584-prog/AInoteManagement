<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><style>body{font:14px system-ui;color:var(--text-color,#ddd)}button{padding:8px;margin:4px;border:1px solid #888;border-radius:6px;background:transparent;color:inherit;cursor:pointer}#files{max-height:210px;overflow:auto}p{font-size:12px}</style><button id="choose">📁 選擇／授權資料夾</button><button id="refresh">↻ 重新整理</button><p id="status">請選擇本地資料夾以查看備份。</p><div id="files"></div><script>
const status=document.querySelector('#status'),files=document.querySelector('#files');let folder;
function height(){parent.postMessage({isStreamlitMessage:true,type:'streamlit:setFrameHeight',height:document.body.scrollHeight+16},'*')}
function db(){return new Promise((ok,no)=>{const r=indexedDB.open('ainote_local_settings_v1',1);r.onupgradeneeded=()=>r.result.createObjectStore('prefs');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function stored(){const d=await db();return new Promise(ok=>{const r=d.transaction('prefs').objectStore('prefs').get('folder');r.onsuccess=()=>ok(r.result);r.onerror=()=>ok(null)})}
async function save(h){const d=await db();return new Promise(ok=>{const r=d.transaction('prefs','readwrite').objectStore('prefs').put(h,'folder');r.onsuccess=ok;r.onerror=ok})}
async function scan(){files.replaceChildren();try{folder=folder||await stored();if(!folder){status.textContent='尚未授權資料夾。';return}if(await folder.queryPermission({mode:'read'})!=='granted'){status.textContent='請點選「選擇／授權資料夾」以允許讀取。';return}let n=0;for await(const [name,entry] of folder.entries()){if(entry.kind!=='file'||!(/\.(ainote|zip|json)$/i.test(name)))continue;n++;const b=document.createElement('button');b.textContent='📄 '+name;b.onclick=async()=>{try{const f=await entry.getFile(),u=URL.createObjectURL(f),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),60000)}catch(e){status.textContent='無法下載：'+e.message}};files.append(b)}status.textContent='目前資料夾：'+folder.name+'（'+n+' 個備份檔案）'}catch(e){status.textContent='無法讀取資料夾：'+e.message}finally{height()}}
document.querySelector('#choose').onclick=async()=>{try{if(!window.showDirectoryPicker)throw Error('目前瀏覽器不支援資料夾存取，請改用上方匯入功能。');folder=await window.showDirectoryPicker({mode:'readwrite'});await save(folder);await scan()}catch(e){status.textContent=e.message;height()}};document.querySelector('#refresh').onclick=scan;
window.addEventListener('message',e=>{if(e.data?.type==='streamlit:render')height()});parent.postMessage({isStreamlitMessage:true,type:'streamlit:componentReady',apiVersion:1},'*');scan();
</script></html>
