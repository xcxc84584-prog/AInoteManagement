  }

  const inlineDisplay=line.match(/^\s*\$\$([\s\S]+?)\$\$\s*$/);

   let heads=cells(line),rows=[];i+=2;
   while(i<lines.length&&lines[i].includes('|')&&lines[i].trim()){rows.push(cells(lines[i]));i++}i--;
   out.push('<div class="table-scroll"><table><thead><tr>'+heads.map(c=>'<th>'+hrcInline(c)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+heads.map((_,j)=>'<td>'+hrcInline(r[j]||'')+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>');continue;
  }
  let marker=null;
  if(marker){out.push('<h3>'+escapeHtml(marker[1])+'</h3>');continue}
  if(false && line.includes('//[')){out.push('<div>'+line.split(/(\/\/\[[^\]\n]+\]\/\/)/g).map(part=>part.startsWith('//[')?'<span class="toc-inline">'+escapeHtml(part.slice(3,-3))+'</span>':hrcInline(part)).join('')+'</div>');continue}
  let h=line.match(/^(#{1,6})\s+(.+)$/);
  if(h){let n=h[1].length;out.push(`<h${n}>${hrcInline(h[2])}</h${n}>`);continue}
  if(/^!\[/.test(line)){out.push('<p>'+hrcInline(line)+'</p>');continue}
  if(/^\s*[-*]\s+/.test(line)){out.push('<div>• '+hrcInline(line.replace(/^\s*[-*]\s+/,''))+'</div>');continue}
  out.push('<div>'+hrcInline(line)+'</div>');

}
function hrcSourceStats(md){

}
function hrcAudit(md,root){

<script>
/* BV-Text v6.2.7 automatic image/SVG local persistence */
(()=>{
'use strict';
const DB='bv-text-media-v627',STORE='images';
let directory=null;const tasks=new Map(),objectUrls=new WeakMap();
function openDB(){return new Promise((ok,no)=>{const r=indexedDB.open(DB,2);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE,{keyPath:'key'});if(!d.objectStoreNames.contains('settings'))d.createObjectStore('settings')};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}

async function dbWrite(store,key,value){const d=await openDB();return new Promise((ok,no)=>{const t=d.transaction(store,'readwrite');if(store===STORE)t.objectStore(store).put(value);else t.objectStore(store).put(value,key);t.oncomplete=()=>{d.close();ok()};t.onerror=()=>{d.close();no(t.error)}})}
function keyFor(url){const m=url.match(/^asset:\/\/([0-9a-f-]{36})$/i);return m?'asset:'+m[1].toLowerCase():'url:'+url}
function isImage(b){return b&&b.size>0&&b.size<=20*1024*1024&&/^image\/(?:png|jpeg|webp|gif|svg\+xml)$/.test(b.type)}
async function download(url){if(!/^(?:data:image\/|https?:\/\/)/i.test(url))return null;try{const r=await fetch(url,{mode:'cors',credentials:'omit'});if(!r.ok)return null;const b=await r.blob();return isImage(b)?b:null}catch{return null}}
async function sha(key){const hash=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(key));return Array.from(new Uint8Array(hash),x=>x.toString(16).padStart(2,'0')).join('')}
async function saveFolder(key,blob){if(!directory)return;const ext={'image/svg+xml':'svg','image/png':'png','image/jpeg':'jpg','image/webp':'webp','image/gif':'gif'}[blob.type]||'bin';const file=await directory.getFileHandle((await sha(key))+'.'+ext,{create:true});const writer=await file.createWritable();await writer.write(blob);await writer.close()}

async function connectFolder(){if(!window.showDirectoryPicker){alert('此瀏覽器或嵌入式元件不支援本地資料夾授權。圖片仍會自動儲存在 IndexedDB。');return}

async function syncFolder(){if(!directory)return;const d=await openDB();const all=await new Promise((ok,no)=>{const r=d.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error);r.transaction.oncomplete=()=>d.close()});for(const item of all){try{await saveFolder(item.key,item.blob)}catch{}}}

async function beforeSave(interactive=false){

})();
