function extractMarkdownImages(text){
 const tokens=[];let output='',i=0;
 while(i<text.length){
  if(text.slice(i,i+2)!=='!['){output+=text[i++];continue}
  let altEnd=text.indexOf('](',i+2);if(altEnd<0){output+=text[i++];continue}

   // or the start of ordinary prose terminates the image.

   for(let j=lineEnd-1;j>=start;j--){if(text[j]===')'){end=j;break}}
  }else{
   let depth=0;for(let j=start;j<text.length;j++){
    if(text[j]==='(')depth++;else if(text[j]===')'){if(depth===0){end=j;break}depth--}
    if(text[j]==='\n')break;
   }
  }

function mathInline(str){

   if(part.startsWith('\\(')&&part.endsWith('\\)'))return mathMarkup(part.slice(2,-2),false);
   if(part.startsWith('$')&&part.endsWith('$')&&part.length>2)return mathMarkup(part.slice(1,-1),false);

function renderMarkdown(md){

}

let browseTargetSeen=null;let chosen='',menu=document.getElementById('menu');let lastRestore='';function anchor(){let s=window.getSelection(),n=s&&s.anchorNode,el=n&&(n.nodeType===1?n:n.parentElement);let blocks=Array.from(editor.children),block=el&&blocks.findIndex(b=>b===el||b.contains(el));return {block:Math.max(0,block),scrollY:window.scrollY||0}}function restore(a){if(!a)return;requestAnimationFrame(()=>{let b=editor.children[a.block];if(b)b.scrollIntoView({block:'center'});else window.scrollTo(0,a.scrollY||0);resize()})}function render(){editor.innerHTML=renderMarkdown(content.replace(/^<!-- bv-split:[^\n]* -->\n?/gm,''));editor.querySelectorAll('img').forEach(im=>{let m=(im.getAttribute('src')||'').match(/^asset:\/\/([0-9a-f-]{36})$/i);if(m){im.dataset.ref=im.getAttribute('src');if(assetUrls[m[1]])im.src=assetUrls[m[1]];else{let warn=document.createElement('span');warn.className='missing-media';warn.textContent='❗ 圖片資料缺失：'+m[1];im.replaceWith(warn)}}});renderMath();requestAnimationFrame(resize)}editor.addEventListener('contextmenu',e=>{let s=window.getSelection();if(!s||s.isCollapsed||!editor.contains(s.anchorNode)){if(!splitUndo)return;chosen='';}else chosen=s.toString().trim();if(!chosen){let target=e.target.closest('#editor > *');if(target)chosen=(target.innerText||target.textContent||'').trim().split('\n')[0].trim()}if(!chosen&&!splitUndo)return;e.preventDefault();menu.style.display='block';menu.style.left=Math.min(e.clientX,innerWidth-210)+'px';menu.style.top=Math.min(e.clientY,innerHeight-110)+'px'});document.addEventListener('click',e=>{if(!menu.contains(e.target))menu.style.display='none'});menu.querySelectorAll('button').forEach(b=>b.onclick=()=>{menu.style.display='none';send('streamlit:setComponentValue',{value:{action:b.dataset.action,selection:chosen,anchor:anchor(),nonce:String(Date.now())+Math.random()}})});window.addEventListener('message',e=>{if(e.data?.type!=='streamlit:render')return;let a=e.data.args||{};if(a.content!==content||a.revision!
