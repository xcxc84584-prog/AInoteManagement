function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function mathFallback(){document.querySelectorAll('#editor .math-render[data-math]').forEach(el=>{if(el.dataset.rendered==='yes')return;el.title='LaTeX 原始碼：'+el.dataset.math;el.style.whiteSpace='pre-wrap';el.style.overflowWrap='anywhere';});}
function mathMarkup(expr,display){return '<span class="math-render'+(display?' math-block':'')+'" contenteditable="false" data-math="'+escapeHtml(expr)+'" data-display="'+(display?'block':'inline')+'">'+escapeHtml(expr)+'</span>'}
// Shared HRC 5.0.1 renderer: same implementation in editor and reader.
function hrcNormalizeSource(md){
 let s=String(md||'').replace(/\r\n?/g,'\n');
 // Recover line-broken SVG data URLs (legacy saved notes), without changing ordinary paragraphs.

  if(a[i].trim()===''&&i>0&&pipe(a[i-1])){
   let j=i+1;while(j<a.length&&a[j].trim()==='')j++;
   if(j<a.length&&pipe(a[j]))continue;
  }
  out.push(a[i]);

}
function hrcImageTokens(text){
 const tokens=[];let output='',i=0;
 while(i<text.length){
  if(text.slice(i,i+2)!=='!['){output+=text[i++];continue}
  const altEnd=text.indexOf('](',i+2);
  if(altEnd<0||altEnd-i>1024){output+=text[i++];continue}
  const start=altEnd+2;
  const probe=text.slice(start,start+100).replace(/\\([:()])/g,'$1');
  const isData=/^data:image\/(?:svg\+xml|png|jpeg|webp|gif)(?:[;,]|$)/i.test(probe);
  let end=-1;
  if(isData){
   // Legacy Markdown escaping may add backslashes to data: and parentheses.
   // Percent-encoded SVG may be huge; search until the closing Markdown delimiter.
   for(let j=start;j<text.length&&j<start+2000000;j++){
    if(text[j]===')' && (j===start||text[j-1]!=='\\')){
     const remainder=text.slice(j+1,j+30);
     if(j+1===text.length||/^\s*(?:\n|$)/.test(remainder)||/^[.,;!?，。；！]/.test(remainder)){end=j;break}
    }
   }
  }else{
   let depth=0;for(let j=start;j<text.length&&j<start+200000;j++){
    if(text[j]==='\n')break;
    if(text[j]==='('&&text[j-1]!=='\\')depth++;
    else if(text[j]===')'&&text[j-1]!=='\\'){if(depth===0){end=j;break}depth--}
   }
  }
  if(end<0){if(isData&&typeof bvLog==='function')bvLog('HRC-SVG-009','SVG image closing delimiter missing');output+=text[i++];continue}
  let src=text.slice(start,end).trim();
  if(isData){
   if(/data\\:image/i.test(src)&&typeof bvLog==='function')bvLog('HRC-SVG-008','Recovered escaped data URI colon');
   src=src.replace(/\\([:()])/g,'$1').replace(/\n/g,'');
  }
  if(!/^(?:data:image\/(?:svg\+xml|png|jpeg|webp|gif)|asset:\/\/|https?:\/\/|clipboard-image:\/\/)/i.test(src)){
   output+=text[i++];continue;
  }

}
function hrcInline(str){
 const x=hrcImageTokens(String(str));
 return x.prepared.split(/(\\\([\s\S]*?\\\)|(?<!\\)\$(?!\$)[^\n$]+?(?<!\\)\$)/g).map(part=>{
  if(part.startsWith('\\(')&&part.endsWith('\\)'))return mathMarkup(part.slice(2,-2),false);
  if(part.startsWith('$')&&part.endsWith('$')&&part.length>2)return mathMarkup(part.slice(1,-1),false);
  return escapeHtml(part).replace(/\uE000(\d+)\uE001/g,(_,id)=>x.tokens[Number(id)]||'')
   .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
   .replace(/(?<!\*)\*([^*\n]+)\*(?!\*)/g,'<em>$1</em>')
   .replace(/`([^`]+)`/g,'<code>$1</code>');

}
function renderMarkdown(md){
 let out=[],lines=hrcNormalizeSource(md).split('\n'),inCode=false,code=[];
 const cells=line=>line.trim().replace(/^\|/,'').replace(/\|$/,'').split(/(?<!\\)\|/).map(x=>x.trim().replace(/\\\|/g,'|'));
 const separator=line=>/^\s*\|?[\s:|\-]+\|?\s*$/.test(line)&&line.includes('-')&&cells(line).every(x=>/^:?-{2,}:?$/.test(x));

  let line=lines[i];
  if(line.startsWith('```')){if(inCode){out.push('<pre><code>'+escapeHtml(code.join('\n'))+'</code></pre>');code=[]}inCode=!inCode;continue}
  if(inCode){code.push(line);continue}

   let square=/^\s*\\\[/.test(line),op=square?'\\[':'$$',cl=square?'\\]':'$$',expr=line.trim().slice(op.length);
   while(!expr.includes(cl)&&i+1<lines.length)expr+='\n'+lines[++i];

   continue;
  }

   let heads=cells(line),rows=[];i+=2;
   while(i<lines.length&&lines[i].includes('|')&&lines[i].trim()){rows.push(cells(lines[i]));i++}i--;
   out.push('<div class="table-scroll"><table><thead><tr>'+heads.map(c=>'<th>'+hrcInline(c)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+heads.map((_,j)=>'<td>'+hrcInline(r[j]||'')+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>');continue;
  }
  let marker=line.match(/^\s*\/\/\[([^\]\n]+)\]\/\/\s*$/);
  if(marker){out.push('<h3>'+escapeHtml(marker[1])+'</h3>');continue}
  if(line.includes('//[')){out.push('<div>'+line.split(/(\/\/\[[^\]\n]+\]\/\/)/g).map(part=>part.startsWith('//[')?'<span class="toc-inline">'+escapeHtml(part.slice(3,-3))+'</span>':hrcInline(part)).join('')+'</div>');continue}

  if(h){let n=h[1].length;out.push(`<h${n}>${hrcInline(h[2])}</h${n}>`);continue}
  if(/^!\[/.test(line)){out.push('<p>'+hrcInline(line)+'</p>');continue}
  if(/^\s*[-*]\s+/.test(line)){out.push('<div>• '+hrcInline(line.replace(/^\s*[-*]\s+/,''))+'</div>');continue}
  out.push('<div>'+hrcInline(line)+'</div>');

}
function hrcSourceStats(md){

}
function hrcAudit(md,root){

}

let browseTargetSeen=null;let chosen='',menu=document.getElementById('menu');let lastRestore='';function anchor(){let s=window.getSelection(),n=s&&s.anchorNode,el=n&&(n.nodeType===1?n:n.parentElement);let blocks=Array.from(editor.children),block=el&&blocks.findIndex(b=>b===el||b.contains(el));return {block:Math.max(0,block),scrollY:window.scrollY||0}}function restore(a){if(!a)return;requestAnimationFrame(()=>{let b=editor.children[a.block];if(b)b.scrollIntoView({block:'center'});else window.scrollTo(0,a.scrollY||0);resize()})}function render(){editor.innerHTML=renderMarkdown(content.replace(/^<!-- bv-split:[^\n]* -->\n?/gm,''));editor.querySelectorAll('img').forEach(im=>{let m=(im.getAttribute('src')||'').match(/^asset:\/\/([0-9a-f-]{36})$/i);if(m){im.dataset.ref=im.getAttribute('src');if(assetUrls[m[1]])im.src=assetUrls[m[1]];else{let warn=document.createElement('span');warn.className='missing-media';warn.textContent='❗ 圖片資料缺失：'+m[1];bvLog('HRC-ASSET-001',m[1]);im.replaceWith(warn)}};im.addEventListener('error',()=>{const warn=document.createElement('span');warn.className='missing-media';warn.textContent='❗ 圖片無法顯示：'+(im.dataset.ref||im.getAttribute('src')||'未知來源').slice(0,150);bvLog('HRC-ASSET-002',warn.textContent);im.replaceWith(warn);resize()},{once:true})});renderMath();hrcAudit(content,editor);requestAnimationFrame(resize)}editor.addEventListener('contextmenu',e=>{let s=window.getSelection();if(!s||s.isCollapsed||!editor.contains(s.anchorNode)){if(!splitUndo)return;chosen='';}else chosen=s.toString().trim();if(!chosen){let target=e.target.closest('#editor > *');if(target)chosen=(target.innerText||target.textContent||'').trim().split('\n')[0].trim()}if(!chosen&&!splitUndo)return;e.preventDefault();menu.style.display='block';menu.style.left=Math.min(e.clientX,innerWidth-210)+'px';menu.style.top=Math.min(e.clientY,innerHeight-110)+'px'});document.addEventListener('click',e=>{if(!menu.contains(e.target))menu.style.display='none'});menu.querySelectorAll('button').f
