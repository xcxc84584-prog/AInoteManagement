<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><style>body{background:transparent;color:#ddd;font:14px system-ui}#drop{border:1px dashed #8999b5;padding:18px;border-radius:8px;outline:none}</style></head><body><div id="drop" tabindex="0">點擊此處，按 Ctrl+V 貼上剪貼簿圖片</div><script>const send=(type,data)=>parent.postMessage({isStreamlitMessage:true,type,...data},'*');document.getElementById('drop').addEventListener('paste',e=>{let file=Array.from(e.clipboardData.files).find(f=>f.type.startsWith('image/'));if(!file)return;e.preventDefault();let r=new FileReader();r.onload=()=>send('streamlit:setComponentValue',{value:{data:r.result,nonce:Date.now()+Math.random()}});r.readAsDataURL(file)});send('streamlit:componentReady',{apiVersion:1});send('streamlit:setFrameHeight',{height:90});</script></body></html>
