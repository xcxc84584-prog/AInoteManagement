<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;padding:4px;font:13px system-ui,sans-serif;color:var(--text-color,#e2e8f0);background:transparent}#grid{display:grid;grid-template-columns:72px repeat(7,minmax(0,1fr));gap:5px}.head{font-weight:650;text-align:center;padding:10px 2px}.week{display:flex;align-items:center;justify-content:center;font-weight:600;color:#8a9aad}.cell{min-height:55px;border:1px solid #6b728055;border-radius:8px;background:#64748b12;color:inherit;cursor:pointer;position:relative;font:inherit;text-align:left;padding:8px}.cell:hover{background:#64748b3d;border-color:#60a5fa}.cell.selected{border:2px solid #60a5fa}.cell.empty{border:0;background:transparent;cursor:default}.count{font-size:11px;display:block;color:#60a5fa;margin-top:5px}.tip{display:none;position:absolute;z-index:20;left:50%;top:100%;transform:translateX(-50%);width:max-content;max-width:260px;white-space:pre-line;padding:9px;border-radius:7px;background:#1f2937;color:#f9fafb;box-shadow:0 5px 20px #0006;pointer-events:none;text-align:left}.cell:hover .tip{display:block}.hint{margin:8px 0;color:#94a3b8;font-size:11px}
</style></head><body><div id="grid"></div><div class="hint">右鍵日期：建立行程（在中央視窗輸入時間、標題及詳細內容）</div><script>
let seq=0;const grid=document.getElementById('grid');function send(action,day){parent.postMessage({isStreamlitMessage:true,type:'streamlit:setComponentValue',value:{action,day,id:Date.now()+'-'+(++seq)}},'*')}
function render(args){grid.replaceChildren();const headers=['週 / 星期','週一','週二','週三','週四','週五','週六','週日'];headers.forEach(t=>{let h=document.createElement('div');h.className='head';h.textContent=t;grid.append(h)});(args.weeks||[]).forEach((week,i)=>{let label=document.createElement('div');label.className='week';label.textContent='第 '+(i+1)+' 週';grid.append(label);week.forEach(d=>{let b=document.createElement('button');b.type='button';b.className='cell'+(!d?' empty':'')+(d?.day===args.selected?' selected':'');if(d){b.textContent=args.display_mode==='pending'?String(d.pending||0):String(d.number);if(args.display_mode!=='pending'&&d.count){let c=document.createElement('span');c.className='count';c.textContent=d.count+' 筆';b.append(c)}let tip=document.createElement('span');tip.className='tip';tip.textContent=d.tip;b.append(tip);b.title=d.tip;b.onclick=()=>send('select',d.day);b.oncontextmenu=e=>{e.preventDefault();send('create',d.day)}}else b.disabled=true;grid.append(b)})});parent.postMessage({isStreamlitMessage:true,type:'streamlit:setFrameHeight',height:Math.max(180,100+(args.weeks||[]).length*62)},'*')}
addEventListener('message',e=>{if(e.data?.type==='streamlit:render')render(e.data.args||{})});parent.postMessage({isStreamlitMessage:true,type:'streamlit:componentReady',apiVersion:1},'*');
</script></body></html>
