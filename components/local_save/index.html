<!doctype html><html><head><meta charset="utf-8"><style>body{font:14px system-ui;color:#d9e0ec;margin:0}button{background:#2866b2;border:0;border-radius:7px;color:white;padding:9px 14px;cursor:pointer}button:disabled{opacity:.45}#info{margin:8px 0;color:#aebbd0;font-size:12px}</style></head><body><button id="btn">💻 下載本地備份</button><div id="info"></div><script>
let args={},busy=false;const btn=document.getElementById('btn'),info=document.getElementById('info');
function send(type,data){parent.postMessage({isStreamlitMessage:true,type,...data},'*')}
function value(obj){send('streamlit:setComponentValue',{value:obj})}
function height(){send('streamlit:setFrameHeight',{height:document.body.scrollHeight+8})}
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open('ainote_local_settings_v1',1);r.onupgradeneeded=()=>r.result.createObjectStore('prefs');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function getHandle(){const db=await openDB();return new Promise((resolve,reject)=>{const t=db.transaction('prefs','readonly').objectStore('prefs').get('folder');t.onsuccess=()=>resolve(t.result);t.onerror=()=>reject(t.error)})}
async function setHandle(h){const db=await openDB();return new Promise((resolve,reject)=>{const t=db.transaction('prefs','readwrite').objectStore('prefs').put(h,'folder');t.onsuccess=resolve;t.onerror=()=>reject(t.error)})}
function bytes(b64){const str=atob(b64);const arr=new Uint8Array(str.length);for(let i=0;i<str.length;i++)arr[i]=str.charCodeAt(i);return arr}
async function update(){if(args.mode==='settings'){btn.textContent='📁 選擇預設儲存資料夾';btn.disabled=typeof window.showDirectoryPicker!=='function';if(btn.disabled)info.textContent='此瀏覽器不支援選擇資料夾，將使用一般下載。';else {try{const h=await getHandle();info.textContent=h?'目前預設資料夾：'+h.name:'尚未選擇資料夾'}catch(e){info.textContent='尚未選擇資料夾'}}}else{btn.textContent=args.mode==='pipeline'?'💾 存儲（先本地，再雲端）':args.mode==='close'?'📦 本地保存後關閉文件':'💻 下載本地備份';btn.disabled=!!args.disabled||busy;info.textContent=args.mode==='pipeline'?'先寫入本地備份，成功後開始雲端上傳。':args.mode==='close'?'需授權本地資料夾；完成寫入後將文件移至回收區。':'只下載本地 .ainote。'}height()}
btn.addEventListener('click',async()=>{if(busy)return;busy=true;btn.disabled=true;try{if(args.mode==='settings'){if(!window.showDirectoryPicker)throw Error('瀏覽器不支援資料夾選擇');const h=await window.showDirectoryPicker({mode:'readwrite'});await setHandle(h);info.textContent='預設資料夾：'+h.name;value({action:'configured',name:h.name})}else{if(!args.data)throw Error('備份內容尚未準備好');const blob=new Blob([bytes(args.data)],{type:'application/zip'});let method='download';let handle=null;try{handle=await getHandle()}catch(e){}if(handle&&await handle.queryPermission({mode:'readwrite'})==='granted'){const f=await handle.getFileHandle(args.filename,{create:true});const w=await f.createWritable();await w.write(blob);await w.close();method='folder'}else if(handle&&await handle.requestPermission({mode:'readwrite'})==='granted'){const f=await handle.getFileHandle(args.filename,{create:true});const w=await f.createWritable();await w.write(blob);await w.close();method='folder'}else{if(args.mode==='close')throw Error('請先在設定中心授權本地資料夾，確保關閉前已完成本地備份');const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=args.filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)}value({action:'saved',method,token:crypto.randomUUID()});info.textContent=method==='folder'?'已寫入本地資料夾':'已啟動本地下載'}}catch(e){value({action:'error',message:String(e.message||e),token:crypto.randomUUID()});info.textContent='操作失敗：'+String(e.message||e)}finally{busy=false;btn.disabled=!!args.disabled; height()}});
window.addEventListener('message',e=>{if(e.data?.type==='streamlit:render'){args=e.data.args||{};update()}});send('streamlit:componentReady',{apiVersion:1});height();
</script></body></html>
