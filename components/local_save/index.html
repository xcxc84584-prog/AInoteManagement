<!doctype html><html><head><meta charset="utf-8"><style>body{font:14px system-ui;color:#d9e0ec;margin:0}button{background:#2866b2;border:0;border-radius:7px;color:white;padding:9px 14px;cursor:pointer}button:disabled{opacity:.45}#info{margin:8px 0;color:#aebbd0;font-size:12px}</style></head><body><button id="btn">💻 下載本地備份</button><div id="info"></div><button id="quick" style="display:none;background:#56677c;margin-top:5px">🔑 快速授權／選擇儲存位置</button><script>
let args={},busy=false;const btn=document.getElementById('btn'),info=document.getElementById('info'),quick=document.getElementById('quick');
function send(type,data){parent.postMessage({isStreamlitMessage:true,type,...data},'*')}
function value(obj){send('streamlit:setComponentValue',{value:obj})}
function height(){send('streamlit:setFrameHeight',{height:document.body.scrollHeight+8})}
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open('ainote_local_settings_v1',1);r.onupgradeneeded=()=>r.result.createObjectStore('prefs');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function getHandle(){const db=await openDB();return new Promise((resolve,reject)=>{const t=db.transaction('prefs','readonly').objectStore('prefs').get('folder');t.onsuccess=()=>resolve(t.result);t.onerror=()=>reject(t.error)})}
async function setHandle(h){const db=await openDB();return new Promise((resolve,reject)=>{const t=db.transaction('prefs','readwrite').objectStore('prefs').put(h,'folder');t.onsuccess=resolve;t.onerror=()=>reject(t.error)})}
function downloadBackup(filename,blob){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)}
async function writeToFolder(handle,filename,blob){
  let existing=false;
  try{await handle.getFileHandle(filename,{create:false});existing=true}catch(e){if(e.name!=='NotFoundError')throw e}
  if(existing&&!window.confirm('「'+filename+'」已存在。是否覆蓋此文件？'))throw Error('使用者取消覆蓋同名文件');
  const f=await handle.getFileHandle(filename,{create:true});const w=await f.createWritable();await w.write(blob);await w.close();
}
function bytes(b64){const str=atob(b64);const arr=new Uint8Array(str.length);for(let i=0;i<str.length;i++)arr[i]=str.charCodeAt(i);return arr}
async function quickAuthorize(){try{
 if(typeof window.showDirectoryPicker==='function'){const h=await window.showDirectoryPicker();await setHandle(h);info.textContent='已授權：'+h.name;quick.style.display='none';value({action:'configured',name:h.name,token:crypto.randomUUID()})}
 else{info.textContent='手機瀏覽器不支援資料夾授權；請使用下方保存按鈕下載本地備份，或使用瀏覽器 IndexedDB 保存筆記。';quick.style.display='none'}
 }catch(e){info.textContent='授權未完成：'+String(e.message||e)}}
 quick.onclick=quickAuthorize;
 async function update(){if(args.mode==='settings'){btn.textContent='📁 選擇預設儲存資料夾';btn.disabled=typeof window.showDirectoryPicker!=='function';if(btn.disabled)info.textContent='此瀏覽器不支援選擇資料夾，將使用一般下載。';else {try{const h=await getHandle();info.textContent=h?'目前預設資料夾：'+h.name:'尚未選擇資料夾'}catch(e){info.textContent='尚未選擇資料夾'}}}else{btn.textContent=args.mode==='pipeline'?'💾 存儲（先本地，再雲端）':args.mode==='close'?'📦 保存整個 ROOT 後關閉':args.mode==='continue'?'💾 保存本地後繼續編輯':args.mode==='schedule'?'💾 保存行程表到本地':'💻 下載本地備份';btn.disabled=!!args.disabled||busy;info.textContent=args.mode==='pipeline'?'先寫入本地備份，成功後開始雲端上傳。':args.mode==='close'?'PC 可選擇授權資料夾或儲存檔案；手機將使用系統下載流程。請確認下載完成。':args.mode==='continue'?'保存本地備份後保留目前文件，可繼續編輯。':'下載格式依設定頁面選擇；若瀏覽器支援，會顯示儲存對話框。'}if(args.mode!=='settings'){try{const handle=await getHandle();quick.style.display=handle?'none':'inline-block';quick.textContent=typeof window.showDirectoryPicker==='function'?'🔑 快速授權本地資料夾':'📱 手機儲存說明'}catch(e){quick.style.display='inline-block'}}height()}
btn.addEventListener('click',async()=>{if(busy)return;busy=true;btn.disabled=true;try{if(args.mode==='settings'){if(!window.showDirectoryPicker)throw Error('瀏覽器不支援資料夾選擇');const h=await window.showDirectoryPicker();await setHandle(h);info.textContent='預設資料夾：'+h.name;value({action:'configured',name:h.name})}else{if(!args.data)throw Error('備份內容尚未準備好');const isSchedule=args.mode==='schedule';const blob=new Blob([bytes(args.data)],{type:isSchedule?'application/json':'application/zip'});let method='download';let handle=null;try{handle=await getHandle()}catch(e){}if(handle&&await handle.queryPermission({mode:'readwrite'})==='granted'){try{await writeToFolder(handle,args.filename,blob);method='folder'}catch(e){if(['NotAllowedError','SecurityError','NotSupportedError'].includes(e.name)){downloadBackup(args.filename,blob);method='download';info.textContent='瀏覽器禁止直接寫入，已改用下載備份。請至下載項目確認。'}else throw e}}else if(handle&&typeof handle.requestPermission==='function'&&await handle.requestPermission({mode:'readwrite'})==='granted'){try{await writeToFolder(handle,args.filename,blob);method='folder'}catch(e){if(['NotAllowedError','SecurityError','NotSupportedError'].includes(e.name)){downloadBackup(args.filename,blob);method='download';info.textContent='瀏覽器禁止直接寫入，已改用下載備份。請至下載項目確認。'}else throw e}}else{if(typeof window.showSaveFilePicker==='function'){
  const f=await window.showSaveFilePicker({suggestedName:args.filename,types:[isSchedule?{description:'BV-Text 行程表 JSON',accept:{'application/json':['.json']}}:{description:'AINOTE ZIP 封裝',accept:{'application/zip':['.zip','.ainote']}}]});
  try{const w=await f.createWritable();await w.write(blob);await w.close();method='folder'}catch(e){if(['NotAllowedError','SecurityError','NotSupportedError'].includes(e.name)){downloadBackup(args.filename,blob);method='download'}else throw e}
}else{
  downloadBackup(args.filename,blob)
}}value({action:'saved',method,token:crypto.randomUUID()});info.textContent=method==='folder'?'已寫入本地資料夾':'已啟動本地下載'}}catch(e){quick.style.display='inline-block';value({action:'error',message:String(e.message||e),token:crypto.randomUUID()});info.textContent='操作失敗：'+String(e.message||e)}finally{busy=false;btn.disabled=!!args.disabled; height()}});
window.addEventListener('message',e=>{if(e.data?.type==='streamlit:render'){args=e.data.args||{};update()}});send('streamlit:componentReady',{apiVersion:1});height();
</script></body></html>
