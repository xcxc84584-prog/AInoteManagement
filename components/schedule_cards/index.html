<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:3px;font:14px system-ui,sans-serif;color:#e4edf8;background:transparent}.card{display:flex;gap:10px;align-items:center;padding:11px 12px;margin:5px 0;border:1px solid #3b4b60;border-radius:9px;background:#1b2535;position:relative}.card:hover{border-color:#7c9bd0}.card input{width:18px;height:18px;flex-shrink:0}.title{flex:1;overflow-wrap:anywhere}.done .title{text-decoration:line-through;opacity:.6}.hint{position:absolute;display:none;z-index:2;left:12px;right:12px;top:calc(100% + 3px);padding:10px;border:1px solid #6a809d;border-radius:7px;background:#26364b;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:0 4px 14px #0009}.card:hover .hint,.card:focus-within .hint{display:none}.menu{position:fixed;display:none;z-index:100;border:1px solid #6882a5;border-radius:7px;background:#26364b;padding:5px;box-shadow:0 5px 15px #0009}.menu button{display:block;width:100%;background:none;color:white;border:0;text-align:left;padding:8px;cursor:pointer}.menu button:hover{background:#405572}.empty{padding:16px;color:#aab}
</style></head><body><div id="cards"></div><div id="menu" class="menu"><button data-act="edit">重新編輯</button><button data-act="delete">刪除</button></div><script>
const list=document.getElementById('cards'),menu=document.getElementById('menu');let cards=[],current=null;
function send(type,data){parent.postMessage({isStreamlitMessage:true,type,...data},'*')}
function height(){send('streamlit:setFrameHeight',{height:Math.max(45,document.body.scrollHeight+12)})}
function action(a,id,value){send('streamlit:setComponentValue',{value:{action:a,id,value,nonce:Date.now()+'-'+Math.random()}})}
function render(){list.replaceChildren();if(!cards.length){const e=document.createElement('div');e.className='empty';e.textContent='尚無行程卡';list.append(e)}for(const card of cards){const row=document.createElement('div');row.className='card'+(card.completed?' done':'');row.tabIndex=0;const cb=document.createElement('input');cb.type='checkbox';cb.checked=!!card.completed;cb.setAttribute('aria-label','是否完成：'+card.title);cb.onchange=()=>action('complete',card.id,cb.checked);const title=document.createElement('span');title.className='title';title.textContent=card.title;const hint=document.createElement('div');hint.className='hint';hint.textContent='日期：'+(card.day||'未設定')+'\n時間：'+card.clock+(card.details?'\n內容：'+card.details:'')+(card.tag?'\n標籤：'+card.tag:'');row.title=hint.textContent;row.append(cb,title);row.oncontextmenu=e=>{e.preventDefault();current=card.id;menu.style.display='block';menu.style.left=Math.max(0,Math.min(e.clientX,innerWidth-130))+'px';menu.style.top=Math.max(0,Math.min(e.clientY,innerHeight-90))+'px'};list.append(row)}height()}
menu.querySelectorAll('button').forEach(b=>b.onclick=()=>{menu.style.display='none';if(current)action(b.dataset.act,current)});document.addEventListener('click',e=>{if(!menu.contains(e.target))menu.style.display='none'});document.addEventListener('keydown',e=>{if(e.key==='Escape')menu.style.display='none'});
window.addEventListener('message',e=>{if(e.data?.type!=='streamlit:render')return;cards=e.data.args?.cards||[];render()});send('streamlit:componentReady',{apiVersion:1});height();
</script></body></html>
