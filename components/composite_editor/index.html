<script>
/* BV-Text 6.2.6 persistent media recovery */
(()=>{
'use strict';
const DB='bv-text-media-v626',STORE='images';
let folder=null;
const pending=new Map(),shown=new WeakMap();
function openDB(){return new Promise((ok,no)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE,{keyPath:'key'});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function get(key){const d=await openDB();return new Promise((ok,no)=>{const r=d.transaction(STORE).objectStore(STORE).get(key);r.onsuccess=()=>{ok(r.result);d.close()};r.onerror=()=>{no(r.error);d.close()}})}
async function put(key,blob){const d=await openDB();return new Promise((ok,no)=>{const t=d.transaction(STORE,'readwrite');t.objectStore(STORE).put({key,blob,time:Date.now()});t.oncomplete=()=>{d.close();ok()};t.onerror=()=>{d.close();no(t.error)}})}
function valid(blob){return blob&&blob.size>0&&blob.size<=15*1024*1024&&/^image\/(?:png|jpeg|gif|webp|svg\+xml)$/.test(blob.type)}
async function fetchBlob(url){
 if(!/^(?:data:image\/|https?:\/\/)/i.test(url))return null;
 try{const r=await fetch(url,{mode:'cors',credentials:'omit'});if(!r.ok)return null;const b=await r.blob();return valid(b)?b:null}catch{return null}
}
async function acquire(key,url){
 if(pending.has(key))return pending.get(key);
 const promise=(async()=>{
  const cached=await get(key).catch(()=>null);
  if(cached?.blob)return cached.blob;
  const blob=await fetchBlob(url);
  if(blob)await put(key,blob).catch(()=>{});
  return blob;

}

async function recover(im,urls={}){
 if(!im.isConnected)return;
 const original=im.dataset.ref||im.dataset.bvOriginalSrc||im.getAttribute('src')||'';
 if(!original||/^blob:/i.test(original))return;
 const id=original.match(/^asset:\/\/([0-9a-f-]{36})$/i);
 const key=id?'asset:'+id[1].toLowerCase():'url:'+original;
 const resolved=id?(urls[id[1]]||urls[id[1].toLowerCase()]||''):original;
 if(!resolved&&!id)return;
 if(im.dataset.bvCacheKey===key&&shown.has(im))return;
 const blob=await acquire(key,resolved);
 if(!blob||!im.isConnected)return;

}
function scan(root=document,urls={}){

}
async function choose(){
 if(!window.showDirectoryPicker){alert('此瀏覽器／嵌入框架無法授權資料夾；IndexedDB 快取仍可使用。');return}

  folder=await window.showDirectoryPicker({mode:'readwrite',id:'bv-text-media'});
  const d=await openDB();const items=await new Promise((ok,no)=>{const q=d.transaction(STORE).objectStore(STORE).getAll();q.onsuccess=()=>{ok(q.result);d.close()};q.onerror=()=>{no(q.error);d.close()}});
  let n=0;for(const it of items){try{await write(it.key,it.blob);n++}catch{}}
  alert('已將 '+n+' 張快取圖片寫入本地資料夾。');

}
function init(){

 btn.style.cssText='position:fixed;right:8px;bottom:8px;z-index:99999;padding:6px 9px;border:1px solid #567;background:#243448;color:white;border-radius:6px;cursor:pointer';
 btn.onclick=choose;document.body.append(btn);
}
window.BVMedia626={scan,recover};

})();
