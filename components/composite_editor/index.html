// Shared HRC 5.0.1 renderer: same implementation in editor and reader.
// Mobile ChatGPT clipboard math normalization. Do not alter fenced code.

// 5.0.7: recover mobile clipboard TeX that arrives without math delimiters.
function recoverMobileMath507(input){
 return String(input||'').split(/(```[\s\S]*?```)/g).map((chunk,index)=>{
  if(index%2)return chunk;
  return chunk.split('\n').map(line=>{
   const t=line.trim();
   if(!t||t.startsWith('![')||/\$|\\\[|\\\]|\\\(|\\\)/.test(t))return line;
   // Conservative: only a complete, standalone TeX assignment is recoverable.
   if(t.length>240||! /^[A-Za-z][A-Za-z0-9]*(?:_\{[^{}]+\})?\s*=\s*.+$/.test(t))return line;
   if(!/\\(?:frac|times|cdot|sqrt|text|sum|int)|_\{|\^\{/.test(t))return line;

  }).join('\n');

  }

function hrcImageTokens(text){

  if(text.slice(i,i+2)!=='!['){output+=text[i++];continue}

   }

function hrcInline(str){

function renderMarkdown(md){

  if(/^\s*[-*]\s+/.test(line)){out.push('<div>• '+hrcInline(line.replace(/^\s*[-*]\s+/,''))+'</div>');continue}

function hrcSourceStats(md){

function hrcAudit(md,root){

}

let lastHeadings='',headingTimer=null;
function tocEntries(){let md=source?raw.value:editor.textContent;return [...md.matchAll(/\/\/\[([^\]\n]+)\]\/\//g)].map((m,i)=>({title:m[1].trim(),index:i,offset:m.index}))}
function updateToc(){let entries=tocEntries(),target=document.getElementById('tocEntries');target.replaceChildren();for(const e of entries){let b=document.createElement('button');b.textContent=(e.index+1)+'. '+e.title;b.onclick=()=>focusHeading(e.index);target.append(b)}if(!entries.length)target.textContent='尚無目錄（使用 //[章節名稱]//）';let key=JSON.stringify(entries.map(x=>x.title));if(key!==lastHeadings){lastHeadings=key;if(images.length)return;clearTimeout(headingTimer);headingTimer=setTimeout(()=>send('streamlit:setComponentValue',{value:{action:'headings',markdown:source?raw.value:editor.textContent,nonce:'h'+Date.now()+Math.random()}}),500)}resize()}
function focusHeading(index){let e=tocEntries()[index];if(!e)return;if(source){raw.focus();raw.setSelectionRange(e.offset,e.offset+e.title.length+6);let line=raw.value.slice(0,e.offset).split('\n').length-1;raw.scrollTop=Math.max(0,line*parseFloat(getComputedStyle(raw).lineHeight||'20')-raw.clientHeight/3)}else{let walker=document.createTreeWalker(editor,NodeFilter.SHOW_TEXT),node;while((node=walker.nextNode())){if(node.textContent.includes(e.title)){node.parentElement.scrollIntoView({block:'center'});editor.focus();break}}}}
function insertAtCaret(node){
 const selection=window.getSelection();
 const valid=selection&&selection.rangeCount&&editor.contains(selection.anchorNode);
 if(!valid){editor.append(node);return}
 const range=selection.getRangeAt(0);
 range.deleteContents();
 // DocumentFragment is emptied by insertNode; it has no parent afterward.
 // Remember its last child BEFORE inserting, then place the caret after that child.
 const last=node.nodeType===Node.DOCUMENT_FRAGMENT_NODE?node.lastChild:node;
 if(!last)return;
 range.insertNode(node);
 if(last.parentNode){range.setStartAfter(last);range.collapse(true);selection.removeAllRanges();selection.addRange(range)}
}
function fileData(f){return new Promise((res,rej)=>{let reader=new FileReader();reader.onload=()=>res(reader.result);reader.onerror=rej;reader.readAsDataURL(f)})}
// Clipboard ingestion is independent from Markdown rendering and document navigation.
function cleanPaste(html){
 const doc=new DOMParser().parseFromString(html,'text/html');
 doc.querySelectorAll('script,iframe,form,link,meta').forEach(n=>n.remove());
 doc.querySelectorAll('style').forEach(n=>{if(!n.closest('svg'))n.remove()});
 doc.querySelectorAll('*').forEach(n=>{for(const a of [...n.attributes]){
  if(a.name.startsWith('on')||['srcdoc','contenteditable'].includes(a.name))n.removeAttribute(a.name);
  if(['href','src'].includes(a.name)&&/^javascript:/i.test(a.value))n.removeAttribute(a.name)
 }});
 return doc.body.innerHTML;
}
function clipboardDiagnostics(cb){
 return {types:[...cb.types],html:cb.getData('text/html').length,plain:cb.getData('text/plain').length,files:[...cb.items].filter(x=>x.kind==='file').map(x=>x.type)};
}
function placeholderImage(label){const n=warningNode('剪貼簿未包含 '+label+' 的可儲存圖像資料');n.dataset.missing='true';return n}
function svgFromMarkup(raw){
 const doc=new DOMParser().parseFromString(raw,'image/svg+xml');
 if(doc.querySelector('parsererror')||doc.documentElement.localName!=='svg')return null;
 return svgData(doc.documentElement);
}
function extractSvgMarkup(text){
 const rx=/<svg\b[^>]*>[\s\S]*?<\/svg>/gi;return [...text.matchAll(rx)].map(m=>m[0]);
}
async function svgToPng(svg){try{const copy=svg.cloneNode(true);copy.setAttribute('xmlns','http://www.w3.org/2000/svg');let rect=svg.getBoundingClientRect();let vb=(svg.getAttribute('viewBox')||'').trim().split(/[ ,]+/).map(Number);let w=Math.max(1,Math.min(2400,Math.round(parseFloat(svg.getAttribute('width'))||rect.width||vb[2]||800)));let h=Math.max(1,Math.min(2400,Math.round(parseFloat(svg.getAttribute('height'))||rect.height||vb[3]||450)));copy.setAttribute('width',w);copy.setAttribute('height',h);const xml=new XMLSerializer().serializeToString(copy);const url=URL.createObjectURL(new Blob([xml],{type:'image/svg+xml'}));try{let im=new Image();await new Promise((ok,fail)=>{im.onload=ok;im.onerror=fail;im.src=url});let canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;canvas.getContext('2d').drawImage(im,0,0,w,h);return canvas.toDataURL('image/png')}finally{URL.revokeObjectURL(url)}}catch(e){return null}}
function svgData(svg){let cp=svg.cloneNode(true);cp.setAttribute('xmlns','http://www.w3.org/2000/svg');return 'data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(new XMLSerializer().serializeToString(cp))))}
function normalizeSvg(src){if(!/^data:image\/svg\+xml/i.test(src)||/;base64,/i.test(src))return src;let at=src.indexOf(',');if(at<0)return src;try{return 'data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(decodeURIComponent(src.slice(at+1)))))}catch(e){return src}}
function registerImage(src,alt){let i=images.length;images.push({data:src});let im=document.createElement('img');im.src=src;im.alt=alt||'圖片';im.dataset.ref='clipboard-image://'+i;return im}
function warningNode(message){let el=document.createElement('span');el.className='missing-media';el.textContent='❗ '+message;return el}
function cleanMathNodes(root){
 for(const n of [...root.querySelectorAll('annotation[encoding="application/x-tex"]')]){
  let host=n.closest('math');if(host){let display=host.getAttribute('display')==='block';let span=document.createElement('span');span.dataset.math=n.textContent;span.dataset.display=display?'block':'inline';span.className='math-render'+(display?' math-block':'');span.textContent=n.textContent;host.replaceWith(span)}
 }
 for(const n of [...root.querySelectorAll('[data-math],[data-tex],[data-latex]')]){
  if(n.classList.contains('math-render'))continue;
  let tex=n.getAttribute('data-math')||n.getAttribute('data-tex')||n.getAttribute('data-latex');
  if(!tex)continue;let span=document.createElement('span');span.dataset.math=tex;span.dataset.display='inline';span.className='math-render';span.textContent=tex;n.replaceWith(span)
 }
}
function parsePlainWithImages(txt){
 let frag=document.createDocumentFragment(),rx=/!\[([^\]\n]*)\]\((data:image\/(?:svg\+xml|png|jpeg|webp|gif)[^\n]*)\)(?=\s|$)/gi,last=0,m;
 while((m=rx.exec(txt))){if(m.index>last)frag.append(document.createTextNode(txt.slice(last,m.index)));frag.append(registerImage(normalizeSvg(m[2]),m[1]||'GPT 圖表'));last=rx.lastIndex}
 if(last<txt.length)frag.append(document.createTextNode(txt.slice(last)));return frag
}
async function pasteChatGPT(cb){
 const html=cb.getData('text/html'),plain=cb.getData('text/plain');
 const diagnostics=clipboardDiagnostics(cb),start=images.length;
 let missing=0,root=document.createElement('div');
 if(html){
  root.innerHTML=cleanPaste(html);cleanMathNodes(root);
  // v3.9.11 compatibility: keep native SVG in the live rich editor.
  // Converting to an <img> at paste time removed the original drawing from the
  // editable DOM and could leave only an invalid placeholder. Serialize on save.
  for(const svg of [...root.querySelectorAll('svg')]){
   try{
    if(!svg.getAttribute('xmlns'))svg.setAttribute('xmlns','http://www.w3.org/2000/svg');
    svg.setAttribute('data-bv-svg','native');
    svg.style.maxWidth='100%';
    svg.style.height=svg.style.height||'auto';
   }catch(err){missing++;svg.replaceWith(placeholderImage('SVG'))}
  }
  for(const obj of [...root.querySelectorAll('object,embed')]){
   const src=obj.getAttribute('data')||obj.getAttribute('src')||'';
   if(/^data:image\/svg\+xml/i.test(src))obj.replaceWith(registerImage(normalizeSvg(src),'SVG 圖表'));
   else{missing++;obj.replaceWith(placeholderImage('嵌入圖形'))}
  }
  for(const im of [...root.querySelectorAll('img')]){
   if(im.dataset.ref)continue;
   let src=im.getAttribute('src')||'';
   if(/^data:image\/(?:svg\+xml|png|jpeg|webp|gif)/i.test(src)){
    im.replaceWith(registerImage(normalizeSvg(src),im.alt||'圖片'));continue
   }
   if(/^https?:\/\//i.test(src)){im.setAttribute('loading','lazy');im.addEventListener('error',()=>im.replaceWith(warningNode('遠端圖片無法載入：'+src.slice(0,100))),{once:true});continue}
   missing++;im.replaceWith(placeholderImage(im.alt||'圖片'));
  }
  // ChatGPT may copy a canvas as a blank placeholder: the bitmap is not present in HTML.
  for(const canvas of [...root.querySelectorAll('canvas')]){missing++;canvas.replaceWith(placeholderImage('Canvas 圖表（請改用圖片複製或截圖）'))}
  // ChatGPT may copy an SVG as a CSS background-image rather than <img>.
  for(const n of [...root.querySelectorAll('[style]')]){
   const style=n.getAttribute('style')||'';
   const match=style.match(/url\(["']?(data:image\/svg\+xml[^"')]+)["']?\)/i);
   if(match){n.prepend(registerImage(normalizeSvg(match[1]),'SVG 背景圖'));n.style.backgroundImage='none'}
  }
  // SVG code blocks copied as plain text should not be mistaken for renderable HTML.
  if(!root.querySelector('img,svg')&&extractSvgMarkup(plain).length){
   for(const markup of extractSvgMarkup(plain)){let data=svgFromMarkup(markup);if(data)root.append(registerImage(data,'SVG 原始碼'))}
  }
 }else if(plain){
  root.append(parsePlainWithImages(plain));
  if(images.length===start){
   const found=extractSvgMarkup(plain);
   for(const markup of found){const data=svgFromMarkup(markup);if(data)root.append(registerImage(data,'SVG 原始碼'))}
  }
 }
 // Clipboard image files are a fallback only, not a duplicate of images found in HTML.
 if(images.length===start){
  for(const item of [...cb.items].filter(x=>x.kind==='file'&&x.type.startsWith('image/'))){
   const f=item.getAsFile();if(f&&f.size<=10*1024*1024)root.append(registerImage(await fileData(f),f.name||'圖片'))
  }
 }
 // Prefer the complete HTML text; if HTML is empty, use the plain text representation.
 if((!root.textContent.trim()&&!root.querySelector('img,table,.math-render'))&&plain)root.append(document.createTextNode(plain));
 const md=block(root).replace(/\n{3,}/g,'\n\n');
 if(source){raw.setRangeText(md,raw.selectionStart,raw.selectionEnd,'end')}
 else{const fragment=document.createDocumentFragment();while(root.firstChild)fragment.append(root.firstChild);insertAtCaret(fragment)}
 updateToc();renderMath();
 bvLog('HRC-CLIP-INFO',JSON.stringify({types:diagnostics.types,htmlChars:diagnostics.html,plainChars:diagnostics.plain,images:images.length-start,missing}));status.textContent='已解析 '+(images.length-start)+' 張圖片；缺失 '+missing+' 張。剪貼簿：'+diagnostics.types.join(', ')+(missing?'。❗ 請檢查圖片缺失':'');
}

// v5.0.3 independent clipboard pipeline; previous paste handler is not used.
async function pasteGPT503(cb){
 const html=cb.getData('text/html')||'',plain=cb.getData('text/plain')||'';
 const notice=document.getElementById('svgClipboardNotice');
 const hasSvg=/\<svg\b|data:image\/svg\+xml|```svg\b|!\[[^\]]*\]\(data:image\/svg/i.test(html+'\n'+plain)||[...cb.items].some(x=>x.type==='image/svg+xml');
 const looksLikeGpt=/ChatGPT|GPT|管線|圖文|測試|公式|markdown|\$\$|\\\[|<table|\|\s*---\s*\|/i.test(html+'\n'+plain);
 if(notice)notice.style.display=looksLikeGpt&&!hasSvg?'block':'none';
 if(looksLikeGpt&&!hasSvg)bvLog('HRC-SVG-CLIP-503','Clipboard did not contain SVG source; this is a possible missing SVG, not proof that one existed.');
 const root=document.createElement('div'),start=images.length;
 if(html.trim()){
  const doc=new DOMParser().parseFromString(html,'text/html');
  doc.querySelectorAll('script,iframe,form,input,button,link,meta,base').forEach(n=>n.remove());
  for(const el of [...doc.body.querySelectorAll('*')])for(const a of [...el.attributes]){
   if(/^on/i.test(a.name)||a.name==='srcdoc'||(['href','src','data'].includes(a.name)&&/^\s*javascript:/i.test(a.value)))el.removeAttribute(a.name);
  }
  for(const svg of [...doc.body.querySelectorAll('svg')]){
   try{svg.replaceWith(registerImage(svgData(svg),'SVG 圖表'))}catch(err){bvLog('503-SVG',err);svg.replaceWith(warningNode('SVG 無法轉換'))}
  }
  for(const im of [...doc.body.querySelectorAll('img')]){
   const src=im.getAttribute('src')||'';
   if(/^data:image\/(svg\+xml|png|jpeg|webp|gif)/i.test(src))im.replaceWith(registerImage(normalizeSvg(src),im.alt||'圖片'));
   else if(!/^https?:\/\//i.test(src)&&!/^asset:\/\//i.test(src))im.replaceWith(warningNode('圖片未包含於剪貼簿'));
  }
  doc.body.querySelectorAll('canvas').forEach(n=>n.replaceWith(warningNode('Canvas 圖形無可複製的像素資料')));
  cleanMathNodes(doc.body);
  while(doc.body.firstChild)root.append(doc.body.firstChild);
 }else if(plain.trim()){
  const holder=document.createElement('div');holder.innerHTML=renderMarkdown(normalizeMobileMath503(plain));
  while(holder.firstChild)root.append(holder.firstChild);
 }
 if(!root.querySelector('img')&&images.length===start){
  for(const item of [...cb.items].filter(x=>x.kind==='file'&&x.type.startsWith('image/'))){
   const file=item.getAsFile();if(file&&file.size<=10*1024*1024)root.append(registerImage(await fileData(file),file.name||'圖片'));
  }
 }
 if(!root.childNodes.length&&plain)root.append(document.createTextNode(plain));
 const md=normalizeMobileMath503(block(root).replace(/\n{3,}/g,'\n\n').trim());
 if(source)raw.setRangeText(md,raw.selectionStart,raw.selectionEnd,'end');
 else{const fragment=document.createDocumentFragment();while(root.firstChild)fragment.append(root.firstChild);insertAtCaret(fragment)}
 updateToc();renderMath();
 status.textContent='v5.0.4 已貼上；內嵌圖片 '+(images.length-start)+' 張，請儲存並重新開啟驗證';
 bvLog('503-CLIP',JSON.stringify({html:html.length,plain:plain.length,images:images.length-start}));
}

editor.addEventListener('paste',async e=>{

 e.preventDefault();
 try{await pasteGPT503(e.clipboardData)}catch(err){bvLog('HRC-CLIP-001',err);status.textContent='❗ 貼上失敗：'+String(err)+'；未自動丟棄剪貼簿內容';}
});
// Source editor has its own paste event; rich clipboard must work in HRC there too.
raw.addEventListener('paste',async e=>{

 e.preventDefault();try{await pasteGPT503(e.clipboardData)}catch(err){bvLog('HRC-CLIP-001',err);status.textContent='❗ 貼上失敗：'+String(err)}
});
document.getElementById('uploadImage').onclick=()=>document.getElementById('imageFile').click();
document.getElementById('imageFile').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;if(f.size>10*1024*1024){status.textContent='圖片不得超過 10 MB';return}const data=await fileData(f),i=images.length;images.push({data});const img=document.createElement('img');img.src=data;img.alt=f.name||'圖片';img.dataset.ref='clipboard-image://'+i;if(source){raw.value+='\n\n!['+(f.name||'圖片').replace(/[\[\]]/g,'')+'](clipboard-image://'+i+')\n';}else insertAtCaret(img);e.target.value='';updateToc();status.textContent='圖片已插入，請儲存圖文文件'};
function resolveAssetImages(){editor.querySelectorAll('img').forEach(im=>{let ref=im.dataset.ref||im.getAttribute('src')||'';let m=ref.match(/^asset:\/\/([0-9a-f-]{36})$/i);if(m){im.dataset.ref=ref;im.src=assetUrls[m[1]]||'';}})}
function restore(md){images=[];md=String(md||'').replace(/^<!-- bv-editor-mode:(?:HRC|COM|MD) -->\n?/,'');editor.innerHTML=renderMarkdown(md);
 editor.querySelectorAll('img').forEach(im=>{const src=im.getAttribute('src')||'';const match=src.match(/^asset:\/\/([0-9a-f-]{36})$/i);if(match){im.dataset.ref=src;im.src=assetUrls[match[1]]||'';if(!assetUrls[match[1]]){im.alt='❗ 圖片資源缺失：'+match[1];im.classList.add('missing-image')}}});
 renderMath();raw.value=md;lastHeadings=JSON.stringify([...md.matchAll(/\/\/\[([^\]\n]+)\]\/\//g)].map(m=>m[1].trim()));updateToc()}
function syncMarkdown(){
 let clone=editor.cloneNode(true);
 clone.querySelectorAll('img[data-ref]').forEach(im=>im.src=im.dataset.ref);
 // SVG is kept as SVG in the editor, then serialized into a persisted image asset.
 // Do not duplicate a resource on repeated saves of the same unchanged SVG.
 for(const svg of [...clone.querySelectorAll('svg')]){
  try{const data=svgData(svg),key=data;let index=images.findIndex(item=>item.data===key);
   if(index<0){index=images.length;images.push({data})}
   const im=document.createElement('img');im.alt='SVG 圖表';im.setAttribute('src','clipboard-image://'+index);im.dataset.ref='clipboard-image://'+index;svg.replaceWith(im)
  }catch(err){bvLog('HRC-SVG-001',err);const warning=document.createElement('span');warning.className='missing-media';warning.textContent='❗ SVG 序列化失敗：'+String(err);svg.replaceWith(warning)}
 }
 return block(clone).replace(/\n{3,}/g,'\n\n').trim()
}
function saveEditor(close=false){let md=normalizeMobileMath503(source?raw.value:syncMarkdown());hrcAudit(md,editor);send('streamlit:setComponentValue',{value:{action:close?'save_close':'save',markdown:md,images,mode:"HRC",nonce:String(Date.now())+Math.random()}});status.textContent=close?'正在儲存，成功後才會退出…':'正在儲存…'}
document.getElementById('save').onclick=()=>saveEditor(false);

document.getElementById('rich').onclick=()=>{if(source){editor.innerHTML=renderMarkdown(raw.value);resolveAssetImages();renderMath();raw.style.display='none';editor.style.display='block';source=false;updateToc()}};
document.getElementById('insert').onclick=()=>{let name=prompt('目錄名稱');if(!name||!name.trim())return;let marker='//['+name.replace(/[\]\n]/g,'').trim()+']//';if(source){raw.value+='\n\n'+marker+'\n';}else{let p=document.createElement('p');p.textContent=marker;insertAtCaret(p)}updateToc()};
editor.addEventListener('input',updateToc);raw.addEventListener('input',updateToc);
window.addEventListener('message',e=>{if(e.data?.type!=='streamlit:render')return;let args=e.data.args||{};if(args.revision!==revision){assetUrls=args.assetUrls||{};revision=args.revision;restore((args.content||'').replace(/^<!-- bv-editor-mode:(HRC|COM|MD) -->\n?/,''));editorMode='HRC'}if(args.submitRequest!=null&&args.submitRequest!==lastSubmitRequest){lastSubmitRequest=args.submitRequest;if(args.submitRequest>0)saveEditor(true)}if(Number.isInteger(args.focusHeading)&&args.focusHeading>=0&&args.focusHeading!==lastFocus){lastFocus=args.focusHeading;focusHeading(args.focusHeading)}resize()});send('streamlit:componentReady',{apiVersion:1});resize();
