<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:12px;background:#0e1117;color:#f1f5f9;font:15px/1.65 system-ui,'Noto Sans TC',sans-serif}.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:12px}button{border:1px solid #4b5871;border-radius:7px;padding:7px 12px;background:#202c42;color:#f8fafc;cursor:pointer}button.primary{background:#2368ba;border-color:#2368ba}#editor{min-height:280px;max-height:680px;overflow:auto;outline:none;border:1px solid #536176;border-radius:9px;padding:18px;background:#151b27;color:#f8fafc;overflow-wrap:anywhere}#editor:focus{border-color:#81b5ff}#editor img{max-width:100%;height:auto}#editor table{border-collapse:collapse;max-width:100%;display:block;overflow-x:auto}#editor th,#editor td{border:1px solid #64748b;padding:7px 11px}#editor pre{white-space:pre-wrap;background:#0b1220;padding:12px;border-radius:7px}#editor blockquote{border-left:3px solid #7199d0;padding-left:14px;margin-left:0}#editor h1,#editor h2,#editor h3{line-height:1.35}#editor a{color:#93c5fd}.hint{font-size:12px;color:#aab7cb;margin:7px 0 12px}#toc{border:1px solid #42516a;border-radius:8px;padding:8px;min-width:165px;max-height:180px;overflow:auto}#toc button{display:block;text-align:left;border:0;background:none;padding:3px 6px;width:100%;font-size:12px}#toc strong{font-size:12px}#status{font-size:12px;color:#aab7cb}textarea{width:100%;min-height:260px;background:#101827;color:#e2e8f0;border:1px solid #536176;border-radius:8px;padding:12px;resize:vertical;font:13px/1.6 monospace}#raw{display:none}.split{display:flex;gap:10px;align-items:flex-start}#main{flex:1;min-width:0}@media(max-width:600px){.split{display:block}#toc{margin-bottom:10px}}
</style></head><body>
<div class="toolbar"><button id="rich">圖文編輯</button><button id="source">Markdown 原始碼</button><button id="insert">插入目錄分段</button><button id="save" class="primary">💾 儲存圖文文件</button><span id="status">可直接貼上 ChatGPT 文字、表格及圖片</span></div>
<div class="hint">輸入 <b>//[章節名稱]//</b> 可建立左側目錄；可在編輯區按 Ctrl+V 貼上 ChatGPT 富文本或圖片。</div>
<div class="split"><nav id="toc"><strong>文件目錄</strong><div id="links"></div></nav><div id="main"><div id="editor" contenteditable="true" spellcheck="false"></div><textarea id="raw" aria-label="Markdown 原始碼"></textarea></div></div>
<script>
const editor=document.getElementById('editor'),raw=document.getElementById('raw'),status=document.getElementById('status'),links=document.getElementById('links');let images=[],revision=-1,source=false,lastFocus=-1;
function send(type,data){parent.postMessage({isStreamlitMessage:true,type,...data},'*')};function resize(){send('streamlit:setFrameHeight',{height:Math.min(document.body.scrollHeight+20,1000)})};function safe(s){return (s||'').replace(/\r/g,'').replace(/\u00a0/g,' ')};
function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function inline(n){if(n.nodeType===3)return safe(n.nodeValue);if(n.nodeType!==1)return '';let t=n.tagName.toLowerCase(),v=Array.from(n.childNodes).map(inline).join('');if(t==='br')return '\n';if(t==='img'){let src=n.getAttribute('src')||'';return '!['+(n.getAttribute('alt')||'圖片').replace(/[\[\]]/g,'')+']('+src+')'}if(t==='b'||t==='strong')return '**'+v+'**';if(t==='em'||t==='i')return '*'+v+'*';if(t==='code')return '`'+v.replace(/`/g,'\\`')+'`';if(t==='a'){let href=n.getAttribute('href')||'';return /^https?:/i.test(href)?'['+v+']('+href+')':v}if(t==='s'||t==='del')return '~~'+v+'~~';return v}
function table(n){let rows=Array.from(n.querySelectorAll('tr')).map(r=>Array.from(r.children).filter(c=>/^(TD|TH)$/.test(c.tagName)).map(c=>inline(c).replace(/\|/g,'\\|').replace(/\n/g,' ')));let w=Math.max(0,...rows.map(r=>r.length));if(!w)return '';let fill=r=>Array.from({length:w},(_,i)=>r[i]||'');return '\n'+[fill(rows[0]),Array(w).fill('---'),...rows.slice(1).map(fill)].map(r=>'| '+r.join(' | ')+' |').join('\n')+'\n\n'}
function block(n){if(n.nodeType===3)return safe(n.nodeValue);if(n.nodeType!==1)return '';let t=n.tagName.toLowerCase();if(t==='table')return table(n);if(t==='img')return inline(n)+'\n\n';if(t==='pre')return '\n```\n'+safe(n.textContent).trimEnd()+'\n```\n\n';if(/^h[1-6]$/.test(t))return '\n'+'#'.repeat(Number(t[1]))+' '+inline(n).trim()+'\n\n';if(t==='ul'||t==='ol')return '\n'+Array.from(n.children).filter(c=>c.tagName==='LI').map((c,i)=>(t==='ul'?'- ':`${i+1}. `)+inline(c).trim()).join('\n')+'\n\n';if(t==='blockquote')return '\n'+inline(n).trim().split('\n').map(x=>'> '+x).join('\n')+'\n\n';if(t==='hr')return '\n---\n';if(['div','p','section','article'].includes(t))return '\n'+Array.from(n.childNodes).map(c=>c.nodeType===1&&/^(TABLE|PRE|UL|OL|DIV|P|SECTION|ARTICLE|H[1-6]|BLOCKQUOTE|IMG)$/.test(c.tagName)?block(c):inline(c)).join('')+'\n\n';return Array.from(n.childNodes).map(block).join('')}
function markdown(){return block(editor).replace(/\n{3,}/g,'\n\n').trim()}
function renderMarkdown(md){let out=[];let inCode=false;for(let line of md.split('\n')){if(line.startsWith('```')){out.push(inCode?'</code></pre>':'<pre><code>');inCode=!inCode;continue}if(inCode){out.push(escapeHtml(line)+'\n');continue}let marker=line.match(/^\s*\/\/\[([^\]\n]+)\]\/\/\s*$/);if(marker){out.push('<p><strong>'+escapeHtml(line)+'</strong></p>');continue}let h=line.match(/^(#{1,6})\s+(.+)$/);if(h){let n=h[1].length;out.push(`<h${n}>${escapeHtml(h[2])}</h${n}>`);continue}if(/^!\[([^\]]*)\]\(([^)]+)\)$/.test(line)){let m=line.match(/^!\[([^\]]*)\]\(([^)]+)\)$/);out.push('<p><img alt="'+escapeHtml(m[1])+'" src="'+escapeHtml(m[2])+'"></p>');continue}if(line.startsWith('|')){out.push('<p>'+escapeHtml(line)+'</p>');continue}out.push('<div>'+escapeHtml(line).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')+'</div>')}return out.join('')}
function updateToc(){let content=source?raw.value:editor.innerText;let entries=[...content.matchAll(/\/\/\[([^\]\n]+)\]\/\//g)].map(m=>m[1].trim());links.replaceChildren();entries.forEach((name,i)=>{let b=document.createElement('button');b.textContent=(i+1)+'. '+name;b.onclick=()=>{if(source){let idx=raw.value.indexOf('//['+name+']//');raw.focus();raw.setSelectionRange(idx,idx)}else{let walker=document.createTreeWalker(editor,NodeFilter.SHOW_TEXT),node;while(node=walker.nextNode()){if(node.textContent.includes('//['+name+']//')){node.parentElement.scrollIntoView({block:'center'});break}}}};links.append(b)});resize()}
function insertAtCaret(node){let s=window.getSelection();if(s&&s.rangeCount&&editor.contains(s.anchorNode)){let r=s.getRangeAt(0);r.deleteContents();r.insertNode(node);r.setStartAfter(node);r.collapse(true);s.removeAllRanges();s.addRange(r)}else editor.append(node)}
function fileData(f){return new Promise((res,rej)=>{let reader=new FileReader();reader.onload=()=>res(reader.result);reader.onerror=rej;reader.readAsDataURL(f)})}
function cleanPaste(html){let doc=new DOMParser().parseFromString(html,'text/html');doc.querySelectorAll('script,style,iframe,object,embed,form,link,meta').forEach(n=>n.remove());doc.querySelectorAll('*').forEach(n=>{for(let a of [...n.attributes]){if(a.name.startsWith('on')||['srcdoc','contenteditable'].includes(a.name))n.removeAttribute(a.name);if(['href','src'].includes(a.name)&&/^javascript:/i.test(a.value))n.removeAttribute(a.name)} });return doc.body.innerHTML}
async function svgToPng(svg){try{const copy=svg.cloneNode(true);copy.setAttribute('xmlns','http://www.w3.org/2000/svg');let rect=svg.getBoundingClientRect();let w=Math.max(1,Math.min(2400,Math.round(parseFloat(svg.getAttribute('width'))||rect.width||800)));let h=Math.max(1,Math.min(2400,Math.round(parseFloat(svg.getAttribute('height'))||rect.height||450)));copy.setAttribute('width',w);copy.setAttribute('height',h);const xml=new XMLSerializer().serializeToString(copy);const url=URL.createObjectURL(new Blob([xml],{type:'image/svg+xml'}));try{let im=new Image();await new Promise((ok,fail)=>{im.onload=ok;im.onerror=fail;im.src=url});let canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;canvas.getContext('2d').drawImage(im,0,0,w,h);return canvas.toDataURL('image/png')}finally{URL.revokeObjectURL(url)}}catch(e){return null}}
editor.addEventListener('paste',async e=>{e.preventDefault();let cb=e.clipboardData,html=cb.getData('text/html'),txt=cb.getData('text/plain');let files=[...cb.items].filter(x=>x.kind==='file'&&x.type.startsWith('image/'));if(html){let wrapper=document.createElement('div');wrapper.innerHTML=cleanPaste(html);for(let svg of [...wrapper.querySelectorAll('svg')]){let data=await svgToPng(svg);if(data){let i=images.length;images.push({data});let im=document.createElement('img');im.src=data;im.setAttribute('data-ref','clipboard-image://'+i);svg.replaceWith(im)}else svg.replaceWith(document.createTextNode('[SVG 圖形無法轉換，請使用截圖貼上]'))}for(let im of [...wrapper.querySelectorAll('img')]){let src=im.getAttribute('src')||'';if(src.startsWith('data:image/')){let i=images.length;images.push({data:src});im.setAttribute('data-ref','clipboard-image://'+i);im.setAttribute('src',src)}else if(!/^https?:/i.test(src))im.replaceWith(document.createTextNode('[無法取得圖片]'))}insertAtCaret(wrapper)}else if(txt){insertAtCaret(document.createTextNode(txt))}if(files.length&&!html){for(let item of files){let f=item.getAsFile();if(!f||f.size>10*1024*1024)continue;let i=images.length,data=await fileData(f);images.push({data});let im=document.createElement('img');im.src=data;im.setAttribute('data-ref','clipboard-image://'+i);insertAtCaret(im)}}updateToc();status.textContent='已貼上，請按「儲存圖文文件」保存'});
function restore(md){images=[];editor.innerHTML=renderMarkdown(md);raw.value=md;updateToc()}
function syncMarkdown(){let clone=editor.cloneNode(true);clone.querySelectorAll('img[data-ref]').forEach(im=>im.src=im.dataset.ref);return block(clone).replace(/\n{3,}/g,'\n\n').trim()}
document.getElementById('save').onclick=()=>{let md=source?raw.value:syncMarkdown();send('streamlit:setComponentValue',{value:{action:'save',markdown:md,images,nonce:String(Date.now())+Math.random()}});status.textContent='正在儲存…'};
document.getElementById('source').onclick=()=>{if(!source){raw.value=syncMarkdown();editor.style.display='none';raw.style.display='block';source=true;updateToc()}};
document.getElementById('rich').onclick=()=>{if(source){editor.innerHTML=renderMarkdown(raw.value);raw.style.display='none';editor.style.display='block';source=false;updateToc()}};
document.getElementById('insert').onclick=()=>{let name=prompt('目錄名稱');if(!name||!name.trim())return;let marker='//['+name.replace(/[\]\n]/g,'').trim()+']//';if(source){raw.value+='\n\n'+marker+'\n';}else{let p=document.createElement('p');p.textContent=marker;insertAtCaret(p)}updateToc()};
editor.addEventListener('input',updateToc);raw.addEventListener('input',updateToc);
window.addEventListener('message',e=>{if(e.data?.type!=='streamlit:render')return;let args=e.data.args||{};if(args.revision!==revision){revision=args.revision;restore(args.content||'')}if(Number.isInteger(args.focusHeading)&&args.focusHeading>=0&&args.focusHeading!==lastFocus){lastFocus=args.focusHeading;let buttons=links.querySelectorAll('button');if(buttons[args.focusHeading])buttons[args.focusHeading].click()}resize()});send('streamlit:componentReady',{apiVersion:1});resize();
</script></body></html>
