<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:12px;background:#0e1117;color:#f1f5f9;font:15px/1.65 system-ui,'Noto Sans TC',sans-serif}.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:12px}button{border:1px solid #4b5871;border-radius:7px;padding:7px 12px;background:#202c42;color:#f8fafc;cursor:pointer}button.primary{background:#2368ba;border-color:#2368ba}#editor{min-height:280px;max-height:680px;overflow:auto;outline:none;border:1px solid #536176;border-radius:9px;padding:18px;background:#151b27;color:#f8fafc;overflow-wrap:anywhere}#editor:focus{border-color:#81b5ff}#editor img{max-width:100%;height:auto}#editor table{border-collapse:collapse;max-width:100%;display:block;overflow-x:auto}#editor th,#editor td{border:1px solid #64748b;padding:7px 11px}#editor pre{white-space:pre-wrap;background:#0b1220;padding:12px;border-radius:7px}#editor blockquote{border-left:3px solid #7199d0;padding-left:14px;margin-left:0}#editor h1,#editor h2,#editor h3{line-height:1.35}#editor a{color:#93c5fd}.hint{font-size:12px;color:#aab7cb;margin:7px 0 12px}#toc{border:1px solid #42516a;border-radius:8px;padding:8px;min-width:165px;max-height:180px;overflow:auto}#toc button{display:block;text-align:left;border:0;background:none;padding:3px 6px;width:100%;font-size:12px}#toc strong{font-size:12px}#status{font-size:12px;color:#aab7cb}textarea{width:100%;min-height:260px;background:#101827;color:#e2e8f0;border:1px solid #536176;border-radius:8px;padding:12px;resize:vertical;font:13px/1.6 monospace}#raw{display:none}.split{display:block}#main{flex:1;min-width:0}@media(max-width:600px){.split{display:block}#toc{margin-bottom:10px}}

/* Unified dark table theme, including pasted ChatGPT tables. */
#editor table{display:block;width:max-content;max-width:100%;overflow-x:auto;border-collapse:collapse;background:#151b27!important;color:#f8fafc!important;border:1px solid #394557!important;border-radius:4px}
#editor table tr,#editor table thead,#editor table tbody{background:#151b27!important;color:#f8fafc!important}
#editor table th,#editor table td{border:1px solid #394557!important;background:#151b27!important;color:#f8fafc!important;min-width:58px;padding:9px 12px;vertical-align:middle;white-space:normal}
#editor table th{font-weight:650;background:#1d2635!important}
#editor table [style*="background"]{background-color:transparent!important}
#editor table [style*="color"]{color:inherit!important}
#editor .math-render{display:inline-block;max-width:100%;overflow-x:auto;vertical-align:middle;white-space:nowrap}
#editor .math-block{display:block;text-align:center;padding:12px 2px;white-space:normal}
#editor .math-render[data-math]{cursor:text}
@media(max-width:600px){#editor{padding:10px}#editor table{max-width:100%}#editor table th,#editor table td{padding:6px 8px;min-width:52px}}
</style><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css"></head><body>
<div class="toolbar"><button id="rich">圖文編輯</button><button id="source">Markdown 原始碼</button><button id="insert">插入目錄分段</button><button id="uploadImage">插入圖片／圖表</button><input id="imageFile" type="file" accept="image/png,image/jpeg,image/webp,image/gif" style="display:none"><button id="save" class="primary">💾 儲存圖文文件</button><span id="status">可直接貼上 ChatGPT 文字、表格及圖片</span></div>
<div class="hint">輸入 <b>//[章節名稱]//</b> 可建立左側目錄；可在編輯區按 Ctrl+V 貼上 ChatGPT 富文本或圖片。</div>
<div class="split"><div id="main"><div id="editor" contenteditable="true" spellcheck="false"></div><textarea id="raw" aria-label="Markdown 原始碼"></textarea></div></div>
<script>
const editor=document.getElementById('editor'),raw=document.getElementById('raw'),status=document.getElementById('status');let images=[],revision=-1,source=false,lastFocus=-1,assetUrls={};
function send(type,data){parent.postMessage({isStreamlitMessage:true,type,...data},'*')};function resize(){send('streamlit:setFrameHeight',{height:Math.min(document.body.scrollHeight+20,1000)})};function safe(s){return (s||'').replace(/\r/g,'').replace(/\u00a0/g,' ')};
function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function inline(n){if(n.nodeType===3)return safe(n.nodeValue);if(n.nodeType!==1)return '';let t=n.tagName.toLowerCase(),v=Array.from(n.childNodes).map(inline).join('');if(n.hasAttribute&&n.hasAttribute('data-math'))return n.getAttribute('data-display')==='block'?'\n\n$$'+n.getAttribute('data-math')+'$$\n\n':'$'+n.getAttribute('data-math')+'$';if(t==='br')return '\n';if(t==='img'){let src=n.getAttribute('src')||'';return '!['+(n.getAttribute('alt')||'圖片').replace(/[\[\]]/g,'')+']('+src+')'}if(t==='b'||t==='strong')return '**'+v+'**';if(t==='em'||t==='i')return '*'+v+'*';if(t==='code')return '`'+v.replace(/`/g,'\\`')+'`';if(t==='a'){let href=n.getAttribute('href')||'';return /^https?:/i.test(href)?'['+v+']('+href+')':v}if(t==='s'||t==='del')return '~~'+v+'~~';return v}
function table(n){let rows=Array.from(n.querySelectorAll('tr')).map(r=>Array.from(r.children).filter(c=>/^(TD|TH)$/.test(c.tagName)).map(c=>inline(c).replace(/\|/g,'\\|').replace(/\n/g,' ')));let w=Math.max(0,...rows.map(r=>r.length));if(!w)return '';let fill=r=>Array.from({length:w},(_,i)=>r[i]||'');return '\n'+[fill(rows[0]),Array(w).fill('---'),...rows.slice(1).map(fill)].map(r=>'| '+r.join(' | ')+' |').join('\n')+'\n\n'}
function block(n){if(n.nodeType===3)return safe(n.nodeValue);if(n.nodeType!==1)return '';let t=n.tagName.toLowerCase();if(t==='table')return table(n);if(t==='img')return inline(n)+'\n\n';if(t==='pre')return '\n```\n'+safe(n.textContent).trimEnd()+'\n```\n\n';if(/^h[1-6]$/.test(t))return '\n'+'#'.repeat(Number(t[1]))+' '+inline(n).trim()+'\n\n';if(t==='ul'||t==='ol')return '\n'+Array.from(n.children).filter(c=>c.tagName==='LI').map((c,i)=>(t==='ul'?'- ':`${i+1}. `)+inline(c).trim()).join('\n')+'\n\n';if(t==='blockquote')return '\n'+inline(n).trim().split('\n').map(x=>'> '+x).join('\n')+'\n\n';if(t==='hr')return '\n---\n';if(['div','p','section','article'].includes(t))return '\n'+Array.from(n.childNodes).map(c=>c.nodeType===1&&/^(TABLE|PRE|UL|OL|DIV|P|SECTION|ARTICLE|H[1-6]|BLOCKQUOTE|IMG)$/.test(c.tagName)?block(c):inline(c)).join('')+'\n\n';return Array.from(n.childNodes).map(block).join('')}
function markdown(){return block(editor).replace(/\n{3,}/g,'\n\n').trim()}
let katexReady=false;
function renderMath(){if(!window.katex)return;document.querySelectorAll('#editor .math-render[data-math]').forEach(el=>{try{window.katex.render(el.dataset.math,el,{throwOnError:false,displayMode:el.dataset.display==='block',strict:'ignore',trust:false})}catch(e){el.textContent=el.dataset.math}})}
function loadKatex(){if(window.katex){katexReady=true;renderMath();return}const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js';sc.onload=()=>{katexReady=true;renderMath()};sc.onerror=()=>{status.textContent='數學字型資源載入失敗；仍保留 LaTeX 原始碼'};document.head.appendChild(sc)}
function mathMarkup(expr,display){return '<span class="math-render'+(display?' math-block':'')+'" contenteditable="false" data-math="'+escapeHtml(expr)+'" data-display="'+(display?'block':'inline')+'">'+escapeHtml(expr)+'</span>'}
function mathInline(str){let parts=String(str).split(/(\\\([\s\S]*?\\\)|(?<!\\)\$(?!\$)[^\n$]+?(?<!\\)\$)/g);return parts.map(part=>{if(part.startsWith('\\(')&&part.endsWith('\\)'))return mathMarkup(part.slice(2,-2),false);if(part.startsWith('$')&&part.endsWith('$')&&part.length>2)return mathMarkup(part.slice(1,-1),false);return escapeHtml(part).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>')}).join('')}
function renderMarkdown(md){
let out=[],lines=md.replace(/\r/g,'').split('\n'),inCode=false,code=[];
const inlineFormat=mathInline;
const cells=line=>line.trim().replace(/^\|/,'').replace(/\|$/,'').split(/(?<!\\)\|/).map(x=>x.trim().replace(/\\\|/g,'|'));
const separator=line=>/^\s*\|?[\s:|\-]+\|?\s*$/.test(line)&&line.includes('-')&&cells(line).every(x=>/^:?-{3,}:?$/.test(x));
for(let i=0;i<lines.length;i++){
 let line=lines[i];
 if(/^\s*\$\$/.test(line)||/^\s*\\\[/.test(line)){let square=/^\s*\\\[/.test(line),op=square?'\\[':'$$',cl=square?'\\]':'$$',expr=line.trim().slice(op.length);while(!expr.includes(cl)&&i+1<lines.length)expr+='\n'+lines[++i];out.push(mathMarkup(expr.slice(0,expr.lastIndexOf(cl)).trim(),true));continue}
 if(line.startsWith('```')){if(inCode){out.push('<pre><code>'+escapeHtml(code.join('\n'))+'</code></pre>');code=[]}inCode=!inCode;continue}
 if(inCode){code.push(line);continue}
 if(line.trim().startsWith('|')&&i+1<lines.length&&separator(lines[i+1])){
  let heads=cells(line),rows=[];i+=2;
  while(i<lines.length&&lines[i].trim().startsWith('|')){rows.push(cells(lines[i]));i++}i--;
  out.push('<table><thead><tr>'+heads.map(c=>'<th>'+inlineFormat(c)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+heads.map((_,j)=>'<td>'+inlineFormat(r[j]||'')+'</td>').join('')+'</tr>').join('')+'</tbody></table>');continue
 }
 let marker=line.match(/^\s*\/\/\[([^\]\n]+)\]\/\/\s*$/);
 if(marker){out.push('<h3>'+escapeHtml(marker[1])+'</h3>');continue}
 let h=line.match(/^(#{1,6})\s+(.+)$/);
 if(h){let n=h[1].length;out.push(`<h${n}>${inlineFormat(h[2])}</h${n}>`);continue}
 let img=line.match(/^!\[([^\]]*)\]\(([^)]+)\)$/);
 if(img){out.push('<p><img alt="'+escapeHtml(img[1])+'" src="'+escapeHtml(img[2])+'"></p>');continue}
 if(/^\s*[-*]\s+/.test(line)){out.push('<div>• '+inlineFormat(line.replace(/^\s*[-*]\s+/,''))+'</div>');continue}
 out.push('<div>'+inlineFormat(line)+'</div>')
}
if(inCode)out.push('<pre><code>'+escapeHtml(code.join('\n'))+'</code></pre>');
return out.join('')
}
let lastHeadings='',headingTimer=null;function updateToc(){let content=source?raw.value:editor.innerText;let entries=[...content.matchAll(/\/\/\[([^\]\n]+)\]\/\//g)].map(m=>m[1].trim());let key=JSON.stringify(entries);if(key!==lastHeadings){lastHeadings=key;clearTimeout(headingTimer);headingTimer=setTimeout(()=>{let md=source?raw.value:syncMarkdown();send('streamlit:setComponentValue',{value:{action:'headings',markdown:md,nonce:'h'+Date.now()+Math.random()}})},500)}resize()}
function focusHeading(index){let content=source?raw.value:editor.innerText;let matches=[...content.matchAll(/\/\/\[([^\]\n]+)\]\/\//g)];if(!matches[index])return;let marker=matches[index][0];if(source){let idx=raw.value.indexOf(marker);raw.focus();raw.setSelectionRange(idx,idx);raw.scrollTop=raw.scrollHeight*idx/Math.max(1,raw.value.length)}else{let walker=document.createTreeWalker(editor,NodeFilter.SHOW_TEXT),node;while(node=walker.nextNode()){if(node.textContent.includes(marker)){node.parentElement.scrollIntoView({block:'center'});let at=node.textContent.indexOf(marker);let selection=window.getSelection();let range=document.createRange();range.setStart(node,Math.max(0,at));range.collapse(true);selection.removeAllRanges();selection.addRange(range);editor.focus();break}}}}
function insertAtCaret(node){let s=window.getSelection();if(s&&s.rangeCount&&editor.contains(s.anchorNode)){let r=s.getRangeAt(0);r.deleteContents();r.insertNode(node);r.setStartAfter(node);r.collapse(true);s.removeAllRanges();s.addRange(r)}else editor.append(node)}
function fileData(f){return new Promise((res,rej)=>{let reader=new FileReader();reader.onload=()=>res(reader.result);reader.onerror=rej;reader.readAsDataURL(f)})}
function cleanPaste(html){let doc=new DOMParser().parseFromString(html,'text/html');doc.querySelectorAll('script,style,iframe,object,embed,form,link,meta').forEach(n=>n.remove());doc.querySelectorAll('*').forEach(n=>{for(let a of [...n.attributes]){if(a.name.startsWith('on')||['srcdoc','contenteditable'].includes(a.name))n.removeAttribute(a.name);if(['href','src'].includes(a.name)&&/^javascript:/i.test(a.value))n.removeAttribute(a.name)} });return doc.body.innerHTML}
async function svgToPng(svg){try{const copy=svg.cloneNode(true);copy.setAttribute('xmlns','http://www.w3.org/2000/svg');let rect=svg.getBoundingClientRect();let vb=(svg.getAttribute('viewBox')||'').trim().split(/[ ,]+/).map(Number);let w=Math.max(1,Math.min(2400,Math.round(parseFloat(svg.getAttribute('width'))||rect.width||vb[2]||800)));let h=Math.max(1,Math.min(2400,Math.round(parseFloat(svg.getAttribute('height'))||rect.height||vb[3]||450)));copy.setAttribute('width',w);copy.setAttribute('height',h);const xml=new XMLSerializer().serializeToString(copy);const url=URL.createObjectURL(new Blob([xml],{type:'image/svg+xml'}));try{let im=new Image();await new Promise((ok,fail)=>{im.onload=ok;im.onerror=fail;im.src=url});let canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;canvas.getContext('2d').drawImage(im,0,0,w,h);return canvas.toDataURL('image/png')}finally{URL.revokeObjectURL(url)}}catch(e){return null}}
editor.addEventListener('paste',async e=>{e.preventDefault();let cb=e.clipboardData,html=cb.getData('text/html'),txt=cb.getData('text/plain');let files=[...cb.items].filter(x=>x.kind==='file'&&x.type.startsWith('image/'));if(html){let wrapper=document.createElement('div');wrapper.innerHTML=cleanPaste(html);for(let svg of [...wrapper.querySelectorAll('svg')]){let data=await svgToPng(svg);if(data){let i=images.length;images.push({data});let im=document.createElement('img');im.src=data;im.setAttribute('data-ref','clipboard-image://'+i);svg.replaceWith(im)}else {let fallback=new XMLSerializer().serializeToString(svg);let blob=new Blob([fallback],{type:'image/svg+xml'});let url=URL.createObjectURL(blob);try{let i=images.length;let data='data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(fallback)));images.push({data});let im=document.createElement('img');im.src=data;im.dataset.ref='clipboard-image://'+i;svg.replaceWith(im)}finally{URL.revokeObjectURL(url)}}}for(let im of [...wrapper.querySelectorAll('img')]){if(im.hasAttribute('data-ref'))continue;let src=im.getAttribute('src')||'';if(src.startsWith('data:image/')){let i=images.length;images.push({data:src});im.setAttribute('data-ref','clipboard-image://'+i);im.setAttribute('src',src)}else if(!/^https?:/i.test(src))im.replaceWith(document.createTextNode('[無法取得圖片]'))}insertAtCaret(wrapper);if(!wrapper.querySelector('img,svg')&&/diagram|flowchart|chart|圖表|流程圖/i.test(txt))status.textContent='剪貼簿未提供圖形資料，請改用複製圖片或截圖貼上'}else if(txt){insertAtCaret(document.createTextNode(txt))}if(files.length&&!html){for(let item of files){let f=item.getAsFile();if(!f||f.size>10*1024*1024)continue;let i=images.length,data=await fileData(f);images.push({data});let im=document.createElement('img');im.src=data;im.setAttribute('data-ref','clipboard-image://'+i);insertAtCaret(im)}}updateToc();status.textContent='已貼上，請按「儲存圖文文件」保存'});
document.getElementById('uploadImage').onclick=()=>document.getElementById('imageFile').click();
document.getElementById('imageFile').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;if(f.size>10*1024*1024){status.textContent='圖片不得超過 10 MB';return}const data=await fileData(f),i=images.length;images.push({data});const img=document.createElement('img');img.src=data;img.alt=f.name||'圖片';img.dataset.ref='clipboard-image://'+i;if(source){raw.value+='\n\n!['+(f.name||'圖片').replace(/[\[\]]/g,'')+'](clipboard-image://'+i+')\n';}else insertAtCaret(img);e.target.value='';updateToc();status.textContent='圖片已插入，請儲存圖文文件'};
function restore(md){images=[];editor.innerHTML=renderMarkdown(md);
 editor.querySelectorAll('img').forEach(im=>{const src=im.getAttribute('src')||'';const match=src.match(/^asset:\/\/([0-9a-f-]{36})$/i);if(match){im.dataset.ref=src;im.src=assetUrls[match[1]]||'';if(!im.src)im.alt='圖片尚未載入，請重新整理';}});
 renderMath();raw.value=md;lastHeadings=JSON.stringify([...md.matchAll(/\/\/\[([^\]\n]+)\]\/\//g)].map(m=>m[1].trim()));updateToc()}
function syncMarkdown(){let clone=editor.cloneNode(true);clone.querySelectorAll('img[data-ref]').forEach(im=>im.src=im.dataset.ref);return block(clone).replace(/\n{3,}/g,'\n\n').trim()}
document.getElementById('save').onclick=()=>{let md=source?raw.value:syncMarkdown();send('streamlit:setComponentValue',{value:{action:'save',markdown:md,images,nonce:String(Date.now())+Math.random()}});status.textContent='正在儲存…'};
document.getElementById('source').onclick=()=>{if(!source){raw.value=syncMarkdown();editor.style.display='none';raw.style.display='block';source=true;updateToc()}};
document.getElementById('rich').onclick=()=>{if(source){editor.innerHTML=renderMarkdown(raw.value);renderMath();raw.style.display='none';editor.style.display='block';source=false;updateToc()}};
document.getElementById('insert').onclick=()=>{let name=prompt('目錄名稱');if(!name||!name.trim())return;let marker='//['+name.replace(/[\]\n]/g,'').trim()+']//';if(source){raw.value+='\n\n'+marker+'\n';}else{let p=document.createElement('p');p.textContent=marker;insertAtCaret(p)}updateToc()};
editor.addEventListener('input',updateToc);raw.addEventListener('input',updateToc);
window.addEventListener('message',e=>{if(e.data?.type!=='streamlit:render')return;let args=e.data.args||{};if(args.revision!==revision){assetUrls=args.assetUrls||{};revision=args.revision;restore(args.content||'')}if(Number.isInteger(args.focusHeading)&&args.focusHeading>=0&&args.focusHeading!==lastFocus){lastFocus=args.focusHeading;let buttons=links.querySelectorAll('button');focusHeading(args.focusHeading)}resize()});send('streamlit:componentReady',{apiVersion:1});resize();
loadKatex();</script></body></html>
